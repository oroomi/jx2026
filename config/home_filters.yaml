# The home list's filters: the rail's facets, the group tabs, the Top matching picker and the country name table.
# Read by radar/home_config.py only; nothing in the Python names a sector, a country or an investor.
#
# facets      the rail, in order. `param` is the URL parameter and the key of a row's `facets` (radar/home_list.py criteria()).
#             A facet is offered when the rows carry values for it; to add one (for example a sector taxonomy's `subsector`), list it here
#             and write `facets[param]` on the rows. `source: theses` is the Sector group: its options are the thesis files in config/,
#             one of them current, and it takes a single choice.
# sections    the headings between rail groups.
# groups      the tabs above the list. `fit` is Top matching: `label_for` is used when an investor or accelerator is picked.
# top_matching  which organisations the picker lists (kinds of radar/matchmaker.py) and which one is picked when the URL names none
#             (used only when the thesis' matchmaker knows it; otherwise the tab reads `label`).
# countries   ISO 3166-1 alpha-2 code -> English name (Unicode CLDR). The stores hold the code; the page prints the name.
# flags       a flag is printed beside a country when `dir`/<lowercase code>.svg exists (flag-icons, MIT; see the README beside the files).

facets:
  - {param: verdict,  heading: Verdict,                     section: criteria, open: true}
  - {param: impact,   heading: Ocean impact,                section: criteria, open: true}
  - {param: trl,      heading: Technology readiness (TRL),  section: criteria, open: true}
  - {param: brl,      heading: Business readiness (BRL),    section: criteria, open: true}
  - {param: irl,      heading: Investment readiness (IRL),  section: criteria, open: true}
  - {param: fit,      heading: Thesis fit,                  section: criteria, open: true}
  - {param: country,  heading: Country,                     section: more,     open: true}
  - {param: sector,   heading: Impact category,             section: more,     open: false}
  - {param: age,      heading: Registered,                  section: more,     open: false}
  - {param: source,   heading: Source records,              section: more,     open: false}
  - {param: deadline, heading: Programme deadline,          section: more,     open: false}
  - {param: member,   heading: Declared company,            section: more,     open: false}

sections:
  criteria: What the judges score
  more: Narrow down

groups:
  all:   {label: All startups}
  fit:   {label: Top fits}
  ready: {label: Investor-ready}
  new:   {label: New this quarter}

