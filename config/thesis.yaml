  stop_words: [platform, smart, optimization, optimisation, optimizing, optimising, integrating, integrated, integrates, integration, results, result, revenue, acquired, acquisition, reports, report, being, annual, dated, retrieved, headcount, delivered, sources, status, started, after, professional, experts, attended, extended, agreements, largest, strongest, ranked, ranking, third, alternative, rather, expected, disclosed, chose, roles, recruited, functions, developer, builder, class, centre, material, series, intelligent, additional, continuously, continues, commercial, commercialise, commercialising, rapid, vision, pitch, public-safety, strong, redacted, footer, legal, matches, lists, participated, exhibiting, cohort, activities, development, design, building, buildings, facilities, processing, publishing, equipment, machinery, structural, electrical, testing, records, analysis, search, operator, supply, maintenance, special-purpose, general-purpose, registered, found, founded, support, sales, collection, production, planning, portfolio, handling, target, source, contribution, prepared, stated, components, distribution, control, office, initiative, countries, named, tools, since, staff, international, large, future, includes, collaborative, reporting, announced, listed, organization, direct, planned, early-stage, pre-seed, under, show, shows, maker, makers, launch, launched, amount, date, hankintatoimi, public-key-infrastructure, helsinki, turku, tampere, espoo, oulu, vantaa, about, across, also, and, are, based, been, both, build, builds, business, businesses, can, companies, company, from, have, help, helps, including, into, more, most, new, other, over, such, that, their, them, these, they, this, through, using, with, within, year, years, startup, startups, start, early, stage, growth, programme, programmes, program, funding, fund, funds, invest, invests, investment, investments, investor, investors, innovation, innovative, solution, solutions, service, services, technology, technologies, industry, industries, market, markets, product, products, partner, partners, partnership, team, teams, finland, finnish, nordic, nordics, europe, european, global, region, regional, national, first, open, close, closed, applications, application, call, calls, ja, on, ovat, että, joka, sekä, tai, ei, oy, ab, ltd, plc, group, oyj, korkea, yritys, yritykset, toiminta]
  keyword_groups:                # the sector and impact vocabulary. `stems`: a word starts with a stem of 5+ letters, or equals a shorter one; a stem with a space is a phrase.
    - id: ocean_data
