# Thesis file: the ONLY place a sector, investor or market is defined. Swap this file and the feed, the company page
# and the radar serve a different thesis (see config/thesis_*.yaml). No code reads sector words from anywhere else.
id: redstone_apelago_blue
title: Blue economy, Finland and Nordics (Redstone Blue x A'Pelago)
sector_label: blue-economy   # display words used in headings and copy; no page names a sector any other way
cohort_label: The Nordic Blue 19
owner_note: >
  Built from Redstone Blue's four areas (redstone.vc/strategies/blue-economy) and A'Pelago's stated themes
  (apelago.fi). Edit here, never in code.

geography:
  countries: [FI]                # register adapters run for these; other countries appear only via declared lists
  feed_window_days: 90           # early-signal feed shows companies whose FIRST signal falls inside this window
  stage_max_company_age_years: 5 # "young company" cut for Hilma first-contract and register-entry signals

themes:                          # Redstone Blue's four areas plus A'Pelago's wording
  - id: maritime_port_tech
    label: Sustainable maritime and port technology
  - id: ocean_infra_clean_energy
    label: Ocean infrastructure and clean energy
  - id: marine_intelligence
    label: Marine intelligence (ocean data, monitoring, emissions)
  - id: blue_bio_water
    label: Blue biotech and water innovation

# TOL 2008 (NACE) codes. A code match alone is only LOW confidence (codes are coarse: Emission-Eye is 62100).
industry_codes:
  - {code: "03210", note: "Marine aquaculture"}
  - {code: "03110", note: "Marine fishing"}
  - {code: "30110", note: "Building of ships and floating structures"}
  - {code: "30120", note: "Building of pleasure and sporting boats"}
  - {code: "33150", note: "Repair and maintenance of ships and boats"}
  - {code: "50100", note: "Sea and coastal passenger water transport"}
  - {code: "50200", note: "Sea and coastal freight water transport"}
  - {code: "52220", note: "Service activities incidental to water transportation"}
  - {code: "36000", note: "Water collection, treatment and supply"}
  - {code: "37000", note: "Sewerage"}
  - {code: "39000", note: "Remediation activities"}
  - {code: "71121", note: "Engineering and technical consulting"}
  - {code: "71200", note: "Technical testing and analysis"}
# Broad consultancy and research families (code prefixes; a dot is ignored, so NACE 71.12 is 711). A code from one of these is a hint
# that the company could be in the sector, never evidence on its own: it admits a company to the main list only together with a sector
# word from the registered line of business, the source's own text, or a legal-name word corroborated by a different source family.
# Alone it leaves the row in the weak list (radar/store.py explain). Codes outside these families (ship building, water, aquaculture) are unchanged.
code_alone_weak: ["711", "712", "721"]

# Name and description keywords (word-start match, case-insensitive). A keyword in the legal name is MEDIUM.
name_keywords:
  fi: [meri, merellinen, vesi, vesi-, aalto, satama, laiva, vene, kala, levä, rannik, itämeri, vedenalai]
  sv: [hav, havs, vatten, marin, skärgård, fisk, hamn]
  en: [ocean, marine, maritime, sea, subsea, underwater, aqua, aquatic, water, blue, offshore, vessel, harbour, port, coastal, algae, kelp, shipping]

# Matching precision (radar/fit.py). A stop word never matches a thesis keyword, even as a word prefix.
keyword_stop_words: [have, blueprint, blueprints, biography, aaltonen, aaltola, vattenfall, marinade, marinated, marinara, waterloo, watermark, hävikki]
# Words that make a legal name a business, never a private person (policy: personal-name holding companies are hidden).
non_person_words: [infra, design, partners, group, solutions, technologies, systems, finland, nordic, software, energy, ventures, properties, real, estate, advisory, management, services, trading, engineering, global]

# Signals the feed counts. A company enters the feed on its FIRST signal inside the window.
# Counted types are dated public records a scout could have seen on that date (audit: EARLINESS_AUDIT.md section 2).
# Deliberately NOT counted: board_change (routine filing), capital_loss, sales_ended, employer_ended (negative),
# website_first_seen (a site existing says nothing about traction; the archive date is only an upper bound).
feed_signal_types: [register_entry, bf_funding, eu_project, blueinvest, patent, public_contract, job_ad, first_sales, first_hire, pilot_named, certification, programme_entry, exhibitor, award, funding_round, product_launch, public_funding, startup_notice, equity_event, research_output, website_milestone, eu_grant]

# Hilma (public contracts): categories where a young company's first win is a signal. CPV divisions.
hilma_cpv_divisions: ["71", "73", "90", "45", "34", "35", "65", "77", "03", "98"]
hilma_keywords: [meri, vesi, satama, väylä, laivaliikenne, jäänmurto, vesistö, kalastus, kalankasvatus, öljyntorjunta, päästö, ilmanlaatu, hydrografi, merikartoitus]

# Readiness scales (rules live in radar/readiness.py; this lists what the page prints)
readiness:
  technology: {scale: "TRL 1-9", source_classes: [patent, eu_project, bf_funding, blueinvest, public_contract]}
  business:   {scale: "1-5 commercial readiness", source_classes: [register_entry, public_contract, site_customer, job_ad]}
  investment: {scale: "IRL 1-9", source_classes: [bf_funding, eu_project, blueinvest]}
  ocean_impact: {scale: "1-5, 'no public evidence' when nothing is published", source_classes: [blueinvest, eu_project]}

# Who comes next: declared lists (data/declared) read by the matching rules
matching:
  investors: data/declared/investors.csv
  corporates: data/declared/corporates_clients.csv
  programmes: data/declared/programmes_grants.csv
  buyer_keywords:                # Finnish title stems per frameworks category, for public buyers in the same category
    ocean data: [merikartoit, hydrograf, kaukokartoit, luotaus, syvyysmittaus, meriympäristö, vesistömittaus]
    aquatech: [kalankasvat, kalastus, kalatalous, vesiviljely, levä]
    emissions: [päästö, sähköist, vetyvoima, akku]
    water quality: [vedenlaatu, jätevesi, vedenpuhdist, painolastivesi, mikromuov, rehevöit]
  ticket_eur: {min: 200000, max: 2000000, source: "https://redstone.vc/strategies/blue-economy"}
  grants_next_dates:
    - {name: "EIC Accelerator 2026 cut-off", date: "2026-11-04", trl_window: "TRL 6-8 (5 completed)", source: "https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/horizon-eic-2026-accelerator-01.json"}
    - {name: "Helsinki Blue Economy Studio by A'Pelago 2027", date: "2026-11-30", source: "https://www.apelago.fi/"}

# Backtest: the 19 Nordic Blue 2026 cohort companies in data/declared/cohort_portfolio_companies.csv (group = cohort)
backtest:
  cohort_group: cohort
  entry_event: "entered Nordic Blue 2026 cohort"

# Countries (jx24). `countries` drives every EU-wide adapter (TED, CORDIS, EU grants, BlueInvest) and the feed country column.
# `country_depth` is printed on /method and above the feed: it says where we hold national-register depth and where only EU sources reach.
countries: [FI]
country_depth:
  FI: registers+contracts+grants

# TED (EU contract award notices): CPV prefixes of marine, port, water and aquaculture work. A prefix matches every code that starts with it.
# A country whose depth lists "contracts" (a national procurement archive, for example Hilma) is skipped by TED so no award is counted twice.
ted_cpv:
  - {prefix: "45241", note: "Harbour construction works"}
  - {prefix: "45242", note: "Hydraulic engineering works for leisure and marine facilities"}
  - {prefix: "45243", note: "Coastal-defence works"}
  - {prefix: "45244", note: "Marine construction works"}
  - {prefix: "45248", note: "Hydro-mechanical structures"}
  - {prefix: "34510", note: "Ships"}
  - {prefix: "34520", note: "Boats"}
  - {prefix: "6372", note: "Water transport services"}
  - {prefix: "65100", note: "Water distribution and related services"}
  - {prefix: "03311", note: "Fish"}
  - {prefix: "77700", note: "Services incidental to fishing"}
  - {prefix: "98360", note: "Marine services"}
  - {prefix: "98361", note: "Aquatic-related services"}

# The fund memo (radar/memo.py). Rules only. Addressed to the fund or accelerator, never to the company.
# Levels become Low / Medium / High through the bands below; a level with no public evidence is "unknown", never Low.
memo:
  labels: {impact: Ocean impact, business: Business readiness, investment: Investment readiness, fit: Thesis fit, technology: Technology readiness}
  bands:                          # sponsor-framework level -> Low / Medium / High (Low at or under low_max, High at or over high_min)
    business: {low_max: 3, high_min: 7}       # KTH BRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    technology: {low_max: 3, high_min: 7}     # Aalto TRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    investment: {low_max: 3, high_min: 7}     # the Investment Readiness level the company page prints (IRL 1-9): 1-3 Low, 4-6 Medium, 7-9 High; no level = unknown
    impact: {category_band: Medium}           # the Navigator category the company page prints = Medium; the dataset's own score is declared research, never a level
    fit:                          # thesis fit from the feed rule's reasons; name-only = Low, no reason = unknown
      high: [industry_code, own_text]
      medium: [line_of_business, corroborated_keyword]
      declared_member_band: Medium     # a declared cohort or portfolio company has at least this fit (it was selected for the programme)
  decisions:
    source: "The team's decision table (pass 1: exact match on all four, first match wins; pass 2: the team's condition rules; pass 3: the fallback for High thesis fit with no impact evidence, only when that fit rests on more than the industry code; otherwise WATCHLIST). Level mapping to Low / Medium / High is the chief's configuration."
    rows:
      - {id: 1, impact: High, business: High, investment: High, fit: High, team: "Invest Candidate", decision: INVEST, action: "Start due diligence and investor introductions"}
      - {id: 2, impact: High, business: High, investment: Medium, fit: High, team: "Investment Preparation", decision: DUE DILIGENCE, action: "Help prepare fundraising and connect with investors"}
      - {id: 3, impact: High, business: Medium, investment: Medium, fit: High, team: "Accelerator Candidate", decision: ACCELERATOR, action: "Accept into accelerator and provide mentoring"}
      - {id: 4, impact: High, business: Low, investment: Low, fit: High, team: "Early-Stage Impact Startup", decision: GRANT SUPPORT, action: "Recommend grants and incubation support"}
      - {id: 5, impact: High, business: Medium, investment: Low, fit: High, team: "Growth Support", decision: PARTNER INTRODUCTION, action: "Connect with pilot customers and strategic partners"}
      - {id: 6, impact: Medium, business: High, investment: High, fit: Medium, team: "Due Diligence", decision: DUE DILIGENCE, action: "Further validate strategic fit and impact claims"}
      - {id: 7, impact: Medium, business: Medium, investment: Medium, fit: Medium, team: "Watchlist", decision: WATCHLIST, action: "Monitor progress and reassess later"}
      - {id: 8, impact: Low, business: High, investment: High, fit: Low, team: "Low Priority", decision: REJECT / LOW FIT, action: "Not aligned with A'Pelago thesis"}
      - {id: 9, impact: Low, business: Medium, investment: Medium, fit: Low, team: "Monitor Only", decision: WATCHLIST, action: "No immediate action"}
      - {id: 10, impact: Low, business: Low, investment: Low, fit: Low, team: "Reject", decision: REJECT / LOW FIT, action: "Not suitable for investment or accelerator support"}
    rules:                         # pass 2, used when no row matches; first match wins; a rule that needs an unknown level does not match
      - {id: a, when: {impact: High, business: High, investment: High}, decision: INVEST, action: "Impact, business and investment all High."}
      - {id: b, when: {impact: High, business: High, investment: Medium}, decision: DUE DILIGENCE, action: "Impact and business High, investment Medium."}
      - {id: c, when: {impact: High, business: Medium}, decision: ACCELERATOR, action: "Impact High, business Medium."}
      - {id: d, when: {impact: High, business: Low}, decision: GRANT SUPPORT, action: "Impact High, business Low."}
      - {id: e, when: {technology: High, business: [Low, Medium]}, decision: PARTNER INTRODUCTION, action: "Technology High, business Low or Medium."}
      - {id: f, when: {impact: Medium, business: Medium, investment: Medium, fit: Medium}, decision: WATCHLIST, action: "All four Medium."}
      - {id: g, when: {impact: Low, fit: Low}, decision: REJECT / LOW FIT, action: "Impact and thesis fit both Low."}
    # pass 3, used when no row and no rule matched: thesis fit High (industry code or the source's own text) and no impact evidence.
    # Impact is then read as implied by the sector (Medium) and the team's rows are applied with measured impact relaxed to that.
    # Gate: an industry code alone must not carry it. At least one of requires_any must hold, else the company stays on the watchlist:
    #   declared_member = declared cohort or portfolio company; own_text = a fit reason from the source's own text (bands.fit.high);
    #   line_of_business = the registered line of business names the sector (the company's own declaration at PRH);
    #   corroborated_signal = a name word backed by a record from a different source family (the feed's corroborated_keyword reason).
    fallback:
      when: {fit: High, impact: unknown}
      requires_any: [declared_member, own_text, line_of_business, corroborated_signal]
      blocked_note: "fit rests on the industry code alone"
      implied_impact: Medium
      rules:
        - {id: c1, when: {business: [Low, Medium], technology: Low}, team: "Early-Stage Impact Startup", decision: GRANT SUPPORT, action: "TRL 1-3: recommend grants and incubation support"}
        - {id: c2, when: {business: [Low, Medium]}, team: "Accelerator Candidate", decision: ACCELERATOR, action: "Accept into accelerator and provide mentoring"}
        - {id: c3, when: {business: High, investment: High}, team: "Investment Preparation", decision: DUE DILIGENCE, action: "Help prepare fundraising and connect with investors"}
    fallback_text: "Fallback (pass 3): when thesis fit is High and there is no public evidence of impact, impact is read as Medium, implied by the sector, but only if the fit rests on more than an industry code: the company is a declared cohort or portfolio company, or a fit reason comes from the source's own text or its registered line of business, or a name word is corroborated by a record from a different source family. A company whose fit rests on the industry code alone stays on the watchlist (more public evidence needed: ocean impact). Then business Low or Medium gives ACCELERATOR (c2), except TRL 1-3 gives GRANT SUPPORT (c1); business High and investment High gives DUE DILIGENCE (c3). The memo prints which one matched."

# Sources the /data page's Refresh button re-reads (names from radar/refresh.py STEPS): the fast live ones only.
refresh_adapters: [prh_notices, prh_recent]

# Wide intake (jx28): startup-shaped companies are taken in wide, then thesis fit is graded by evidence. Config only: no code reads these words.
# A company enters intake on the date its `min_signals`-th startup signal (a type from `startup_signals`, not the register entry) is dated,
# provided its legal form is in `company_forms` (limited companies and cooperatives, never sole traders) and its industry code starts with
# one of `code_prefixes` or is a code listed under industry_codes.
intake:
  company_forms:
    - {code: "16", note: "Limited company (PRH company form 16)"}
    - {code: "14", note: "Cooperative (PRH company form 14)"}
  code_prefixes: ["03", "26", "27", "28", "29", "30", "582", "62", "63", "71", "72"]
  tuning_note: "The families 582 (software publishing) and 03 (fishing and aquaculture) were added after the backtest showed the net missed two cohort companies, so results for those two are measured on the companies used to tune the net."   # printed on /method and /backtest; the two families were added after the backtest, so say so
  min_signals: 1
  startup_signals: [first_sales, first_hire, eu_project, eu_grant, research_output, bf_funding, startup_notice, equity_event, public_funding]
