# Thesis file: the ONLY place a sector, investor or market is defined. Swap this file and the feed, the company page
# and the radar serve a different thesis (see config/thesis_*.yaml). No code reads sector words from anywhere else.
id: redstone_apelago_blue
title: Blue economy, Finland and Nordics (Redstone Blue x A'Pelago)
sector_label: blue-economy   # display words used in headings and copy; no page names a sector any other way
cohort_label: The Nordic Blue 19
owner_note: >
  Built from Redstone Blue's four areas (redstone.vc/strategies/blue-economy) and A'Pelago's stated themes
  (apelago.fi). Edit here, never in code.

geography:
  countries: [FI]                # register adapters run for these; other countries appear only via declared lists
  feed_window_days: 90           # early-signal feed shows companies whose FIRST signal falls inside this window
  stage_max_company_age_years: 5 # "young company" cut for Hilma first-contract and register-entry signals

themes:                          # Redstone Blue's four areas plus A'Pelago's wording
  - id: maritime_port_tech
    label: Sustainable maritime and port technology
  - id: ocean_infra_clean_energy
    label: Ocean infrastructure and clean energy
  - id: marine_intelligence
    label: Marine intelligence (ocean data, monitoring, emissions)
  - id: blue_bio_water
    label: Blue biotech and water innovation

# TOL 2008 (NACE) codes. A code match alone is only LOW confidence (codes are coarse: Emission-Eye is 62100).
industry_codes:
  - {code: "03210", note: "Marine aquaculture"}
  - {code: "03110", note: "Marine fishing"}
  - {code: "30110", note: "Building of ships and floating structures"}
  - {code: "30120", note: "Building of pleasure and sporting boats"}
  - {code: "33150", note: "Repair and maintenance of ships and boats"}
  - {code: "50100", note: "Sea and coastal passenger water transport"}
  - {code: "50200", note: "Sea and coastal freight water transport"}
  - {code: "52220", note: "Service activities incidental to water transportation"}
  - {code: "36000", note: "Water collection, treatment and supply"}
  - {code: "37000", note: "Sewerage"}
  - {code: "39000", note: "Remediation activities"}
  - {code: "71121", note: "Engineering and technical consulting"}
  - {code: "71200", note: "Technical testing and analysis"}

# Name and description keywords (word-start match, case-insensitive). A keyword in the legal name is MEDIUM.
name_keywords:
  fi: [meri, merellinen, vesi, vesi-, aalto, satama, laiva, vene, kala, levä, rannik, itämeri, vedenalai]
  sv: [hav, havs, vatten, marin, skärgård, fisk, hamn]
  en: [ocean, marine, maritime, sea, subsea, underwater, aqua, aquatic, water, blue, offshore, vessel, harbour, port, coastal, algae, kelp, shipping]

# Matching precision (radar/fit.py). A stop word never matches a thesis keyword, even as a word prefix.
keyword_stop_words: [have, blueprint, blueprints, biography, aaltonen, aaltola, vattenfall, marinade, marinated, marinara, waterloo, watermark, hävikki]
# Words that make a legal name a business, never a private person (policy: personal-name holding companies are hidden).
non_person_words: [infra, design, partners, group, solutions, technologies, systems, finland, nordic, software, energy, ventures, properties, real, estate, advisory, management, services, trading, engineering, global]

# Signals the feed counts. A company enters the feed on its FIRST signal inside the window.
# Counted types are dated public records a scout could have seen on that date (audit: EARLINESS_AUDIT.md section 2).
# Deliberately NOT counted: board_change (routine filing), capital_loss, sales_ended, employer_ended (negative),
# website_first_seen (a site existing says nothing about traction; the archive date is only an upper bound).
feed_signal_types: [register_entry, bf_funding, eu_project, blueinvest, patent, public_contract, job_ad, first_sales, first_hire, pilot_named, certification, programme_entry, exhibitor, award, funding_round, product_launch, public_funding, startup_notice, equity_event, research_output, website_milestone, eu_grant]

# Hilma (public contracts): categories where a young company's first win is a signal. CPV divisions.
hilma_cpv_divisions: ["71", "73", "90", "45", "34", "35", "65", "77", "03", "98"]
hilma_keywords: [meri, vesi, satama, väylä, laivaliikenne, jäänmurto, vesistö, kalastus, kalankasvatus, öljyntorjunta, päästö, ilmanlaatu, hydrografi, merikartoitus]

# Readiness scales (rules live in radar/readiness.py; this lists what the page prints)
readiness:
  technology: {scale: "TRL 1-9", source_classes: [patent, eu_project, bf_funding, blueinvest, public_contract]}
  business:   {scale: "1-5 commercial readiness", source_classes: [register_entry, public_contract, site_customer, job_ad]}
  investment: {scale: "IRL 1-9", source_classes: [bf_funding, eu_project, blueinvest]}
  ocean_impact: {scale: "1-5, 'no public evidence' when nothing is published", source_classes: [blueinvest, eu_project]}

# Who comes next: declared lists (data/declared) read by the matching rules
matching:
  investors: data/declared/investors.csv
  corporates: data/declared/corporates_clients.csv
  programmes: data/declared/programmes_grants.csv
  buyer_keywords:                # Finnish title stems per frameworks category, for public buyers in the same category
    ocean data: [merikartoit, hydrograf, kaukokartoit, luotaus, syvyysmittaus, meriympäristö, vesistömittaus]
    aquatech: [kalankasvat, kalastus, kalatalous, vesiviljely, levä]
    emissions: [päästö, sähköist, vetyvoima, akku]
    water quality: [vedenlaatu, jätevesi, vedenpuhdist, painolastivesi, mikromuov, rehevöit]
  ticket_eur: {min: 200000, max: 2000000, source: "https://redstone.vc/strategies/blue-economy"}
  grants_next_dates:
    - {name: "EIC Accelerator 2026 cut-off", date: "2026-11-04", trl_window: "TRL 6-8 (5 completed)", source: "https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/horizon-eic-2026-accelerator-01.json"}
    - {name: "Helsinki Blue Economy Studio by A'Pelago 2027", date: "2026-11-30", source: "https://www.apelago.fi/"}

# Backtest: the 19 Nordic Blue 2026 cohort companies in data/declared/cohort_portfolio_companies.csv (group = cohort)
backtest:
  cohort_group: cohort
  entry_event: "entered Nordic Blue 2026 cohort"

# Countries (jx24). `countries` drives every EU-wide adapter (TED, CORDIS, EU grants, BlueInvest) and the feed country column.
# `country_depth` is printed on /method and above the feed: it says where we hold national-register depth and where only EU sources reach.
countries: [FI]
country_depth:
  FI: registers+contracts+grants

# TED (EU contract award notices): CPV prefixes of marine, port, water and aquaculture work. A prefix matches every code that starts with it.
# A country whose depth lists "contracts" (a national procurement archive, for example Hilma) is skipped by TED so no award is counted twice.
ted_cpv:
  - {prefix: "45241", note: "Harbour construction works"}
  - {prefix: "45242", note: "Hydraulic engineering works for leisure and marine facilities"}
  - {prefix: "45243", note: "Coastal-defence works"}
  - {prefix: "45244", note: "Marine construction works"}
  - {prefix: "45248", note: "Hydro-mechanical structures"}
  - {prefix: "34510", note: "Ships"}
  - {prefix: "34520", note: "Boats"}
  - {prefix: "6372", note: "Water transport services"}
  - {prefix: "65100", note: "Water distribution and related services"}
  - {prefix: "03311", note: "Fish"}
  - {prefix: "77700", note: "Services incidental to fishing"}
  - {prefix: "98360", note: "Marine services"}
  - {prefix: "98361", note: "Aquatic-related services"}

# The fund memo (radar/memo.py). Rules only. Addressed to the fund or accelerator, never to the company.
# Levels become Low / Medium / High through the bands below; a level with no public evidence is "unknown", never Low.
memo:
  labels: {impact: Ocean impact, business: Business readiness, investment: Investment readiness, fit: Thesis fit, technology: Technology readiness}
  bands:                          # sponsor-framework level -> Low / Medium / High (Low at or under low_max, High at or over high_min)
    business: {low_max: 3, high_min: 7}       # KTH BRL 1-9
    investment: {low_max: 3, high_min: 7}     # investment level 1-9
    technology: {low_max: 3, high_min: 7}     # Aalto TRL 1-9
    impact: {category_band: Medium, dataset_low_max: 1, dataset_high_min: 4}   # Navigator category found = Medium; dataset reading mapped by its 0-5 score
    fit: {high_min_reasons: 2, medium_min_reasons: 1}   # distinct feed-rule reasons (industry code, line of business, source text, corroborated name word, declared membership)
  decisions:
    source: "PROVISIONAL draft by the build session. The team's own 10-row table was not in the repo (VPS-only doc); replace these rows with it. First match wins; no match = WATCHLIST."
    rows:                          # a cell is a band, a list of bands, or any; unknown matches only any
      - {id: 1, impact: [High, Medium], business: High, investment: High, fit: High, decision: INVEST, action: "Open an investment conversation now."}
      - {id: 2, impact: [High, Medium], business: [High, Medium], investment: [High, Medium], fit: [High, Medium], decision: DUE DILIGENCE, action: "Start due diligence with the investors listed below."}
      - {id: 3, impact: [High, Medium], business: High, investment: Low, fit: [High, Medium], decision: DUE DILIGENCE, action: "Commercial traction without funding history: check the traction, then introduce an investor."}
      - {id: 4, impact: [High, Medium], business: Medium, investment: Low, fit: [High, Medium], decision: ACCELERATOR, action: "Offer a place in an accelerator programme with investor preparation."}
      - {id: 5, impact: [High, Medium], business: Low, investment: [Low, Medium], fit: [High, Medium], decision: GRANT SUPPORT, action: "Point to the open grants and calls below before any equity."}
      - {id: 6, impact: [Low, Medium], business: [High, Medium], investment: any, fit: [High, Medium], decision: PARTNER INTRODUCTION, action: "Introduce to the ports, municipalities and research institutes below."}
      - {id: 7, impact: Low, business: any, investment: any, fit: Low, decision: REJECT / LOW FIT, action: "Low fit on public evidence: no action."}
