      stems: [decarbon, emission, hydrogen, ammonia, methanol, battery, batteries, electrif, fuel cell, shore power, energy efficien, wind-assist, wind assist, energy storage, clean energy, renewable, net zero, päästö, sähköist, vetyvoima, akku, energiatehok, hiilineutraal]
    - id: autonomy_navigation
      label: maritime autonomy and navigation
      theme: maritime_port_tech
      capability: C1
      stems: [autonom, navigation, vessel, vessels, remote pilot, situational, route optimi, ship software, maritime software, voyage, fleet, traffic management]
    - id: ship_design
      label: ship design and propulsion
      theme: maritime_port_tech
      capability: C2
      stems: [shipbuild, shipyard, ship design, naval architect, hull, propulsion, boat, boats, yacht, yachts, watercraft, ferry, ferries, icebreaker, telakka, laiva, vene, alus]
    - id: ports_logistics
