  - {prefix: "45243", note: "Coastal-defence works"}
  - {prefix: "45244", note: "Marine construction works"}
  - {prefix: "45248", note: "Hydro-mechanical structures"}
  - {prefix: "34510", note: "Ships"}
  - {prefix: "34520", note: "Boats"}
  - {prefix: "6372", note: "Water transport services"}
  - {prefix: "65100", note: "Water distribution and related services"}
  - {prefix: "03311", note: "Fish"}
  - {prefix: "77700", note: "Services incidental to fishing"}
  - {prefix: "98360", note: "Marine services"}
  - {prefix: "98361", note: "Aquatic-related services"}

# Ocean Impact Readiness read as EVIDENCE READINESS from public records (radar/ocean_impact.py; D27 in PROJECT_RULES.md). It is not a
# measure of true impact. The Ocean Impact Navigator publishes impact areas and KPIs but no levels, and no sponsor definition of the levels
# is in the repo or in data/declared, so this ladder is ours: each rung says which kind of record must be on file. The highest rung whose
# test passes wins. Rung text and the line that would raise a company one step live here, applied by code; the area table below is the only
# place an impact area is named. No rung is ever guessed: a company with no record naming an area has no level.
impact_readiness:
  title: Ocean Impact Assessment
  label: Ocean Impact Readiness
  level_max: 9
  bands: {evidenced_min: 3, low_max: 2, high_min: 8}   # level 1-2 (sector-implied only) = no band, shown as "not yet evidenced" with the record that would raise it; Medium (3-7); High (8-9, a measured outcome is on record); no level = no band
  # Declared research (the ecosystem dataset) may set rungs 7 and 8 only, and only when its own confidence is at least min_confidence;
  # a low-confidence reading is listed as a lead and sets nothing (A24). Its score runs 0-5 on the dataset's own scale:
  # assessment_min_score = a reading with evidence is on record; measured_min_score = a quantified outcome with a stated method.
  declared_research: {min_confidence: medium, assessment_min_score: 1, measured_min_score: 4, scale_max: 5}
  official_outcome_types: []             # signal types that would count as a measured outcome from an official or register source (rung 9): none is connected
  programme_hosts: {"apelago.fi": "A'Pelago", "redstone.vc": "Redstone Blue"}   # a record on one of these hosts is a programme or portfolio declaring the company
  areas:                                 # impact area in words; words match as whole words or word starts (5+ letters); code_prefixes are industry-code families
    emissions:
      label: "Climate: lower emissions from ships, boats and ports"
      words: [emission, decarbon, shipping fuel, ammonia, hydrogen, battery, electrif, päästö, sähköist, vetyvoima, akku]
      code_prefixes: []
    aquatech:
      label: "Sustainable ocean resources: aquaculture and fisheries"
      words: [aquacultur, fish farm, aquatech, algae, seaweed, fisher, kalankasvat, kalastus, kalatalous, vesiviljely, levä]
      code_prefixes: ["03"]
    water_quality:
      label: "A clean ocean: water quality and pollution"
      words: [water quality, wastewater, ballast, water treatment, microplastic, eutroph, vedenlaatu, jätevesi, vedenpuhdist, painolastivesi, mikromuov, rehevöit]
      code_prefixes: ["36", "37"]
    ocean_data:
      label: "Ocean data and monitoring"
      words: [ocean data, oceanograph, hydrograph, remote sensing, sonar, bathymetr, marine data, merikartoit, hydrograf, kaukokartoit, luotaus, syvyysmittaus, meriympäristö, vesistömittaus]
      code_prefixes: []
    maritime:
      label: "Sustainable maritime and port technology"
      words: []
      code_prefixes: ["301", "33150", "501", "502", "52220"]
  scalability:                           # records that show a market beyond one country; otherwise "not assessed from public records"
    register_countries: {prh: FI, brreg: NO, cvr: DK, estonia_register: EE}   # source family -> the country of that register
    eu_level_types: [blueinvest, eu_project]                                   # signal types whose programme runs across EU member states
    market_words: [export, international, global, worldwide, overseas, abroad]
  levels:
    - {level: 1, rule: "Sector implied: one record points to the area: an industry code in its family, a sector word in the registered line of business, or a legal-name word backed by a second source family.", raise: "Own text that names the area: a notice title, EU project text or investor-pipeline profile holding an area word."}
    - {level: 2, rule: "Sector implied: two or more of those records point to the area; none is the source's own text.", raise: "Own text that names the area: a notice title, EU project text or investor-pipeline profile holding an area word."}
    - {level: 3, rule: "The source's own text names the area: one record (a notice title, project text or profile) holds an area word.", raise: "A second source that names the same area, or a listing on a blue programme or portfolio page."}
    - {level: 4, rule: "The source's own text names the area in two or more separate records.", raise: "A second source family that names the same area, or a listing on a blue programme or portfolio page."}
    - {level: 5, rule: "The area is corroborated: a second independent source family names it, or a blue programme or portfolio lists the company.", raise: "The other corroboration: a listing on a blue programme or portfolio page, or a second independent source family naming the area.", raise_next_rung: "Rung 6 needs a record from a source family other than the register whose own text names the area: a notice title, EU project text or investor-pipeline profile holding an area word."}
    - {level: 6, rule: "Corroborated twice: a second independent source family names the area and a blue programme or portfolio lists the company.", raise: "An impact assessment in declared research, with dataset confidence medium or high."}
    - {level: 7, rule: "An impact assessment is on record: declared research holds an Ocean Impact Readiness reading with evidence, at dataset confidence medium or high.", raise: "A quantified outcome with a stated method in the declared research reading."}
    - {level: 8, rule: "A measured outcome is on record: declared research reports a quantified outcome with a stated method.", raise: "A measured outcome from an official or register source; none is connected."}
    - {level: 9, rule: "A measured outcome from an official or register source.", raise: "None: this is the top rung."}
  no_level:
    rule: "No rung applies: no record on file names an impact area for this company."
    raise: "Any record that names an impact area: a registered line of business, a notice title, a project text or a profile."

# The fund memo (radar/memo.py). Rules only. Addressed to the fund or accelerator, never to the company.
# Levels become Low / Medium / High through the bands below; a level with no public evidence is "unknown", never Low.
memo:
  labels: {impact: Ocean impact, business: Business readiness, investment: Investment readiness, fit: Thesis fit, technology: Technology readiness}
  bands:                          # sponsor-framework level -> Low / Medium / High (Low at or under low_max, High at or over high_min)
    business: {low_max: 3, high_min: 7}       # KTH BRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    technology: {low_max: 3, high_min: 7}     # Aalto TRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    investment: {low_max: 3, high_min: 7}     # the Investment Readiness level the company page prints (IRL 1-9): 1-3 Low, 4-6 Medium, 7-9 High; no level = unknown
    impact: {category_band: Medium}           # the Navigator category the company page prints = Medium; the dataset's own score is declared research, never a level
    fit:                          # thesis fit from the feed rule's reasons; name-only = Low, no reason = unknown
      high: [industry_code, own_text]
      medium: [line_of_business, corroborated_keyword]
      # Code families whose industry-code match is Medium, not High (D22). 36 water collection, treatment and supply, 37 sewerage,
      # 39 remediation are municipal utility codes: a company registered there is a sector match, but not a High fit on the code alone.
      # The company's own text, or a name word corroborated by a different source family, can still lift it to High.
      medium_codes: ["36", "37", "39"]
      declared_member_band: High       # a declared cohort or portfolio company has at least this fit (it was selected for the programme; D47)
  decisions:
    source: "The team's decision table (pass 1: exact match on all four, first match wins; pass 2: the team's condition rules; pass 3: the fallback for High thesis fit with no impact evidence, only when that fit rests on more than the industry code; otherwise WATCHLIST). Level mapping to Low / Medium / High is the chief's configuration."
    rows:
      - {id: 1, impact: High, business: High, investment: High, fit: High, team: "Invest Candidate", decision: INVEST, action: "Start due diligence and investor introductions"}
      - {id: 2, impact: High, business: High, investment: Medium, fit: High, team: "Investment Preparation", decision: DUE DILIGENCE, action: "Help prepare fundraising and connect with investors"}
      - {id: 3, impact: High, business: Medium, investment: Medium, fit: High, team: "Accelerator Candidate", decision: ACCELERATOR, action: "Accept into accelerator and provide mentoring"}
      - {id: 4, impact: High, business: Low, investment: Low, fit: High, team: "Early-Stage Impact Startup", decision: GRANT SUPPORT, action: "Recommend grants and incubation support"}
      - {id: 5, impact: High, business: Medium, investment: Low, fit: High, team: "Growth Support", decision: PARTNER INTRODUCTION, action: "Connect with pilot customers and strategic partners"}
      - {id: 6, impact: Medium, business: High, investment: High, fit: Medium, team: "Due Diligence", decision: DUE DILIGENCE, action: "Further validate strategic fit and impact claims"}
      - {id: 7, impact: Medium, business: Medium, investment: Medium, fit: Medium, team: "Watchlist", decision: WATCHLIST, action: "Monitor progress and reassess later"}
      - {id: 8, impact: Low, business: High, investment: High, fit: Low, team: "Low Priority", decision: REJECT / LOW FIT, action: "Not aligned with A'Pelago thesis"}
      - {id: 9, impact: Low, business: Medium, investment: Medium, fit: Low, team: "Monitor Only", decision: WATCHLIST, action: "No immediate action"}
      - {id: 10, impact: Low, business: Low, investment: Low, fit: Low, team: "Reject", decision: REJECT / LOW FIT, action: "Not suitable for investment or accelerator support"}
    rules:                         # pass 2, used when no row matches; first match wins; a rule that needs an unknown level does not match
      - {id: a, when: {impact: High, business: High, investment: High}, decision: INVEST, action: "Impact, business and investment all High."}
      - {id: b, when: {impact: High, business: High, investment: Medium}, decision: DUE DILIGENCE, action: "Impact and business High, investment Medium."}
      - {id: c, when: {impact: High, business: Medium}, decision: ACCELERATOR, action: "Impact High, business Medium."}
      - {id: d, when: {impact: High, business: Low}, decision: GRANT SUPPORT, action: "Impact High, business Low."}
      - {id: e, when: {technology: High, business: [Low, Medium]}, decision: PARTNER INTRODUCTION, action: "Technology High, business Low or Medium."}
      - {id: f, when: {impact: Medium, business: Medium, investment: Medium, fit: Medium}, decision: WATCHLIST, action: "All four Medium."}
      - {id: g, when: {impact: Low, fit: Low}, decision: REJECT / LOW FIT, action: "Impact and thesis fit both Low."}
    # pass 3, used when no row and no rule matched: thesis fit High (industry code or the source's own text) and no impact evidence.
    # Impact is then read as implied by the sector (Medium) and the team's rows are applied with measured impact relaxed to that.
    # Gate: an industry code alone must not carry it. At least one of requires_any must hold, else the company stays on the watchlist:
    #   declared_member = declared cohort or portfolio company; own_text = a fit reason from the source's own text (bands.fit.high);
    #   line_of_business = the registered line of business names the sector (the company's own declaration at PRH);
    #   corroborated_signal = a name word backed by a record from a different source family (the feed's corroborated_keyword reason).
    fallback:
      when: {fit: High, impact: unknown}
      requires_any: [declared_member, own_text, line_of_business, corroborated_signal]
      blocked_note: "fit rests on the industry code alone"
      implied_impact: Medium
      rules:
        - {id: c1, when: {business: [Low, Medium], technology: Low}, team: "Early-Stage Impact Startup", decision: GRANT SUPPORT, action: "TRL 1-3: recommend grants and incubation support"}
        - {id: c2, when: {business: [Low, Medium]}, team: "Accelerator Candidate", decision: ACCELERATOR, action: "Accept into accelerator and provide mentoring"}
        - {id: c3, when: {business: High, investment: High}, team: "Investment Preparation", decision: DUE DILIGENCE, action: "Help prepare fundraising and connect with investors"}
    fallback_text: "Fallback (pass 3): when thesis fit is High and there is no public evidence of impact, impact is read as Medium, implied by the sector, but only if the fit rests on more than an industry code: the company is a declared cohort or portfolio company, or a fit reason comes from the source's own text or its registered line of business, or a name word is corroborated by a record from a different source family. A company whose fit rests on the industry code alone stays on the watchlist (more public evidence needed: ocean impact). Then business Low or Medium gives ACCELERATOR (c2), except TRL 1-3 gives GRANT SUPPORT (c1); business High and investment High gives DUE DILIGENCE (c3). The memo prints which one matched."

# Sources the /data page's Refresh button re-reads (names from radar/refresh.py STEPS): the fast live ones only.
refresh_adapters: [prh_notices, prh_recent]

# Wide intake (jx28): startup-shaped companies are taken in wide, then thesis fit is graded by evidence. Config only: no code reads these words.
# A company enters intake on the date its `min_signals`-th startup signal (a type from `startup_signals`, not the register entry) is dated,
# provided its legal form is in `company_forms` (limited companies and cooperatives, never sole traders) and its industry code starts with
# one of `code_prefixes` or is a code listed under industry_codes.
intake:
  company_forms:
    - {code: "16", note: "Limited company (PRH company form 16)"}
    - {code: "14", note: "Cooperative (PRH company form 14)"}
  code_prefixes: ["03", "26", "27", "28", "29", "30", "582", "62", "63", "71", "72"]
  tuning_note: "The families 582 (software publishing) and 03 (fishing and aquaculture) were added after the backtest showed the net missed two cohort companies, so results for those two are measured on the companies used to tune the net."   # printed on /method and /backtest; the two families were added after the backtest, so say so
  min_signals: 1
  startup_signals: [first_sales, first_hire, eu_project, eu_grant, research_output, bf_funding, startup_notice, equity_event, public_funding]

# Ask Aava bar (radar/ask.py, GET /api/ask). Every word the bar understands lives here, none in code. A phrase matches whole words,
# longest phrase first. Keys left out of another thesis file are inherited from this one; `examples` and `sectors` are per thesis.
ask:
  examples:                       # the placeholder cycles through these; each must be answerable by the bar
    - "What is new on the radar?"
    - "Tell me about Viva Jets"
    - "Who should A'Pelago meet?"
    - "Show accelerator candidates in Finland"
    - "Aquaculture startups with a TRL above 4"
    - "Show high thesis fit companies in Finland"            # the bar shows the first five that have a non-empty answer in the store (D40)
    - "Show companies on the watchlist"
  lead_ins: [tell me about, what do you know about, what about, show me, find me, find, open, about, give me, list]
  filler_words: [a, an, the, all, any, some, me, show, list, give, find, companies, company, startups, startup, firms, in, with, and, of, that, are, is, only, which, have, has, from, based, top]
  feed_words: [what is new, what's new, whats new, new on the radar, new this week, new this quarter, newest, latest, recent, recently, anything new, whats happening, what is happening]
  meet_patterns:                  # {org} is the organisation or company named
    - "who should {org} meet"
    - "who does {org} need to meet"
    - "who to meet for {org}"
    - "who should we introduce to {org}"
    - "match {org}"
    - "matches for {org}"
    - "introductions for {org}"
  top_phrases:                    # "top startups" and its kin: the Top matching ranking of the default organisation (A'Pelago), or of the one named (D70)
    [top startups, best startups, top matching startups, top matching, top matches, best matches, best match, top match, best investment, best investments,
     best startup, top startup, who should we invest in, who should we back, who to invest in]
  top_patterns:                   # {org} is the investor or accelerator named; the ranking is that organisation's
    - "who should {org} invest in"
    - "who should {org} back"
    - "who should {org} fund"
    - "who should {org} accept"
    - "top startups for {org}"
    - "best startups for {org}"
    - "top matching startups for {org}"
    - "top matches for {org}"
    - "best matches for {org}"
    - "best investment for {org}"
    - "best investments for {org}"
    - "{org} top startups"
    - "{org} best startups"
  org_types:                      # type column of data/declared/*.csv -> words for one line
    vc: a venture capital investor
    corporate_vc: a corporate venture investor
    angel: an angel investor
    public: a public funder
    accelerator: an accelerator programme
    grant: a grant programme
    equity: an equity fund
    shipyard: a shipyard
  org_default: an organisation in the declared lists
  filters:                        # phrase -> filter-rail parameters (verdict, group, impact, fit); `say` is how the answer names it
    - {words: [investment ready, investment-ready, investor ready, investor-ready, ready to invest], set: {group: ready}, say: "investor-ready"}
    - {words: [accelerator, accelerator candidate, accelerator candidates], set: {verdict: ACCELERATOR}, say: "accelerator candidates"}
    - {words: [due diligence], set: {verdict: DUE DILIGENCE}, say: "due diligence candidates"}
    - {words: [invest, invest candidate, invest candidates], set: {verdict: INVEST}, say: "invest candidates"}
    - {words: [watchlist, watch list, watchlisted], set: {verdict: WATCHLIST}, say: "on the watchlist"}
    - {words: [grant support, grant candidates], set: {verdict: GRANT SUPPORT}, say: "grant support candidates"}
    - {words: [partner introduction, partner introductions], set: {verdict: PARTNER INTRODUCTION}, say: "partner introduction candidates"}
    - {words: [low fit, rejected, reject], set: {verdict: "REJECT / LOW FIT"}, say: "rejected or low fit"}
    - {words: [high impact, impact high], set: {impact: High}, say: "high ocean impact"}
    - {words: [high fit, top fit, top fits, thesis fit high, strong fit], set: {fit: High}, say: "high thesis fit"}
    - {words: [new this quarter, first seen lately], set: {group: new}, say: "new this quarter"}
  countries:                      # code -> the words that name it; the names the home list prints are always understood too
    FI: [finland, finnish]
    SE: [sweden, swedish]
    NO: [norway, norwegian]
    DK: [denmark, danish]
    EE: [estonia, estonian]
    IS: [iceland, icelandic]
    DE: [germany, german]
    PL: [poland, polish]
    ES: [spain, spanish]
  sectors:                        # value of the filter rail's Sector facet (the framework category) -> words that name it
    Aquatech: [aquaculture, aquatech, fish farming, fish farm, fisheries, seaweed, algae, aquaculture startups]
    Ocean data: [ocean data, hydrography, bathymetry, sonar, remote sensing, marine data]
    Emissions: [emissions, decarbonisation, decarbonization, hydrogen, battery, electrification, shipping fuel]
    Water quality: [water quality, wastewater, ballast water, water treatment, microplastics]
  level_names:                    # filter parameter -> words that name the scale
    trl: [trl, technology readiness, technology readiness level]
    brl: [brl, business readiness, business readiness level]
    irl: [irl, investment readiness level]
  level_ops:                      # comparison words before the number: above/below exclude the number, atleast/atmost include it
    above: [above, over, more than, greater than, higher than, ">"]
    atleast: [at least, from, ">="]
    below: [below, under, less than, lower than, "<"]
    atmost: [at most, up to, "<="]
