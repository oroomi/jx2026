# Thesis file: the ONLY place a sector, investor or market is defined. Swap this file and the feed, the company page
# and the radar serve a different thesis (see config/thesis_*.yaml). No code reads sector words from anywhere else.
id: baltic_blue
title: Blue economy, Baltic Sea region (Redstone Blue x A'Pelago)
owner_note: >
  Built from Redstone Blue's four areas (redstone.vc/strategies/blue-economy) and A'Pelago's stated themes
  (apelago.fi). Edit here, never in code.

geography:
  countries: [FI, SE, EE, LV, LT, DK, "NO", DE, PL]  # same list as the top-level `countries` key
  feed_window_days: 90           # early-signal feed shows companies whose FIRST signal falls inside this window
  stage_max_company_age_years: 5 # "young company" cut for Hilma first-contract and register-entry signals

themes:                          # Redstone Blue's four areas plus A'Pelago's wording
  - id: maritime_port_tech
    label: Sustainable maritime and port technology
  - id: ocean_infra_clean_energy
    label: Ocean infrastructure and clean energy
  - id: marine_intelligence
    label: Marine intelligence (ocean data, monitoring, emissions)
  - id: blue_bio_water
    label: Blue biotech and water innovation

# TOL 2008 (NACE) codes. A code match alone is only LOW confidence (codes are coarse: Emission-Eye is 62100).
industry_codes:
  - {code: "03210", note: "Marine aquaculture"}
  - {code: "03220", note: "Freshwater aquaculture"}
  - {code: "03110", note: "Marine fishing"}
  - {code: "03211", note: "Marine aquaculture (Estonian EMTAK code)"}
  - {code: "03111", note: "Marine fishing (Estonian EMTAK code)"}
  - {code: "30110", note: "Building of ships and floating structures"}
  - {code: "30120", note: "Building of pleasure and sporting boats"}
  - {code: "33150", note: "Repair and maintenance of ships and boats"}
  - {code: "50100", note: "Sea and coastal passenger water transport"}
  - {code: "50200", note: "Sea and coastal freight water transport"}
  - {code: "52220", note: "Service activities incidental to water transportation"}
  - {code: "36000", note: "Water collection, treatment and supply"}
  - {code: "37000", note: "Sewerage"}
  - {code: "39000", note: "Remediation activities"}
  - {code: "71121", note: "Engineering and technical consulting"}
  - {code: "71200", note: "Technical testing and analysis"}
# Broad consultancy and research families (code prefixes; a dot is ignored, so NACE 71.12 and Estonian EMTAK 71121 are both 711). A code from one of these is a hint
# that the company could be in the sector, never evidence on its own: it admits a company to the main list only together with a sector
# word from the registered line of business, the source's own text, or a legal-name word corroborated by a different source family.
# Alone it leaves the row in the weak list (radar/store.py explain). Codes outside these families (ship building, water, aquaculture) are unchanged.
code_alone_weak: ["711", "712", "721"]

# Name and description keywords (word-start match, case-insensitive). A keyword in the legal name is MEDIUM.
name_keywords:
  fi: [meri, merellinen, vesi, vesi-, aalto, satama, laiva, vene, kala, levä, rannik, itämeri, vedenalai]
  sv: [hav, havs, vatten, marin, skärgård, fisk, hamn]
  et: [mere, mereline, vesi, laev, sadam, kala, vetikas, veealune]
  "no": [hav, sjø, marin, maritim, fiskeri, akvakultur, havn, skip, offshore]
  da: [hav, marin, maritim, fiskeri, akvakultur, havn, skib]
  en: [ocean, marine, maritime, sea, subsea, underwater, aqua, aquatic, water, blue, offshore, vessel, harbour, port, coastal, algae, kelp, shipping]

# Matching precision (radar/fit.py). A stop word never matches a thesis keyword, even as a word prefix.
keyword_stop_words: [have, blueprint, blueprints, biography, aaltonen, aaltola, vattenfall, marinade, marinated, marinara, waterloo, watermark, hävikki]
# Words that make a legal name a business, never a private person (policy: personal-name holding companies are hidden).
non_person_words: [infra, design, partners, group, solutions, technologies, systems, finland, nordic, software, energy, ventures, properties, real, estate, advisory, management, services, trading, engineering, global]

# Signals the feed counts. A company enters the feed on its FIRST signal inside the window.
feed_signal_types: [register_entry, bf_funding, eu_project, blueinvest, patent, public_contract, job_ad]

# Hilma (public contracts): categories where a young company's first win is a signal. CPV divisions.
hilma_cpv_divisions: ["71", "73", "90", "45", "34", "35", "65", "77", "03", "98"]
hilma_keywords: [harbour, marine, maritime, vessel, ferry, water, sewage, aquaculture, fishing, fishery, coastal, dredging, offshore, subsea, meri, vesi, satama, väylä, laivaliikenne, jäänmurto, vesistö, kalastus, kalankasvatus, öljyntorjunta, päästö, ilmanlaatu, hydrografi, merikartoitus]

# Readiness scales (rules live in radar/readiness.py; this lists what the page prints)
readiness:
  technology: {scale: "TRL 1-9", source_classes: [patent, eu_project, bf_funding, blueinvest]}   # a public contract sets business readiness only, never TRL (D77)
  business:   {scale: "1-5 commercial readiness", source_classes: [register_entry, public_contract, site_customer, job_ad]}
  investment: {scale: "IRL 1-9", source_classes: [bf_funding, eu_project, blueinvest]}
  ocean_impact: {scale: "1-5, 'no public evidence' when nothing is published", source_classes: [blueinvest, eu_project]}

# Who comes next: declared lists (data/declared) read by the matching rules
matching:
  investors: data/declared/investors.csv
  corporates: data/declared/corporates_clients.csv
  programmes: data/declared/programmes_grants.csv
  ticket_eur: {min: 200000, max: 2000000, source: "https://redstone.vc/strategies/blue-economy"}
  grants_next_dates:
    - {name: "EIC Accelerator 2026 cut-off", date: "2026-11-04", trl_window: "TRL 6-8 (5 completed)", source: "https://ec.europa.eu/info/funding-tenders/opportunities/data/topicDetails/horizon-eic-2026-accelerator-01.json"}
    - {name: "Helsinki Blue Economy Studio by A'Pelago 2027", date: "2026-11-30", source: "https://www.apelago.fi/"}

# Backtest: the 19 Nordic Blue 2026 cohort companies in data/declared/cohort_portfolio_companies.csv (group = cohort)
backtest:
  cohort_group: cohort
  entry_event: "entered Nordic Blue 2026 cohort"

# Sector taxonomy (D42, owner-approved 17 Oct): one top-level sector with eleven sub-sectors and a twelfth, derived, "Not yet classified". A company
# can sit in several sub-sectors; every link stores its basis (the evidence kind) and the record it rests on. radar/sectors.py applies this block and
# nothing else: no sector word is in the code. Evidence kinds a sub-sector accepts (`evidence`):
#   code               an industry code starting with one of `code_prefixes` (a dot is ignored, so NACE 03.110 is 03110). A gated code (`gated_codes`) counts only
#                      together with a word of the named word set in the company's own text or a corroborated name word; it never classifies alone.
#   own_text           a word of the sub-sector in the company's own text: the registered line of business, the CORDIS title and objective, the BlueInvest profile,
#                      a quote the stitcher checked on a page, the verified brief. Never our own `detail` annotations (D2).
#   name_corroborated  a word of the sub-sector in the legal name AND a record from a different source family (A6); a name word alone classifies nothing (A5).
#   declared           the declared ecosystem dataset's capability (C1 to C10) or a declared list's category, mapped in `declared:` below.
#   notice             a word of the sub-sector in the title of a public procurement notice the company won (Hilma).
# Words come from the keyword groups of `matching:` (by id), the impact areas of `impact_readiness:` (by key) and `words` written here; they match as whole
# words, or as the start of a longer word when they have 5 or more characters (A8). Impact-area code prefixes count as `code`.
taxonomy:
  slug: blue_economy
  label: Blue economy
  evidence_kinds: [code, own_text, name_corroborated, declared, notice]
  keyword_groups:                  # this thesis has no matchmaking block, so the three groups the sub-sectors name are kept here, word for word as in config/thesis.yaml (tests/test_sectors.py keeps them equal)
    - id: ocean_data
      label: ocean data and sensing
      theme: marine_intelligence
      capability: C4
      category: ocean data
      stems: [ocean data, oceanograph, hydrograph, bathymetr, remote sensing, satellite, sensor, sensing, monitoring, buoy, buoys, drone, drones, digital twin, imaging, sonar, hyperspectral, weather, mittaus, merikartoit, kaukokartoit, vesistömittaus, seuranta]
    - id: aquaculture_bio
      label: aquaculture and fisheries
      theme: blue_bio_water
      capability: C5
      category: aquatech
      stems: [aquacultur, aquatech, fish, fisher, salmon, shellfish, mussel, oyster, algae, seaweed, kelp, macroalgae, marine biotech, blue bio, bioeconom, protein, seafood, kalankasvat, kalastus, kalatalous, kala, levä, vesiviljely]
    - id: offshore_energy
      label: offshore and marine energy
      theme: ocean_infra_clean_energy
      capability: C8
      stems: [offshore, wind farm, wind power, wave energy, tidal, floating, marine renewable, ocean energy, marine construction, subsea cable, tuulivoima]
  unclassified: {slug: not_classified, label: Not yet classified}
  word_sets:                       # gates a sub-sector can require beside a code
    maritime:
      words: [maritime, maritim, marine, seafar, seaborne, shipyard, shipbuild, vessel, vessels, offshore, subsea, harbour, harbor, seaport, port of, port call,
              ocean, sea, boat, boats, ferry, ferries, yacht, yachts, naval, coastal, icebreaker, archipelago, ships, merenkulku, merellinen, merellä, meren,
              merialue, meriliikenne, laiva, satam, saaristo, vene, veneet, telakka]
    boating:
      words: [boating, boat, boats, marina, marinas, yacht, yachts, sailing, sailboat, kayak, canoe, cruise, cruises, diving, archipelago, saaristo, purjehd,
              vene, veneet, soutu, melont, risteil]
  declared:                        # where the `declared` evidence comes from; the capability labels are read from the dataset
    ecosystem_db: data/declared/ecosystem/blue_economy_fi.sqlite   # entity_capability (C1 to C10), joined to the store through eco_entity
    lists:
      - {file: data/declared/startups_universe.csv, id_column: y_tunnus_if_found, category_column: category, url_column: source_url, label: Startup universe list}
  sectors:
    - slug: shipbuilding_boats
      label: Shipbuilding and boats
      evidence: [code, declared]
      code_prefixes: ["301"]                       # 3011 ships and floating structures, 3012 pleasure and sporting boats
      declared: {capabilities: [C2]}
    - slug: ship_repair_services
      label: Ship repair and maritime services
      evidence: [code]
      code_prefixes: ["3315", "5222"]              # 3315 repair of ships and boats (331 as a whole also repairs machinery: not used), 5222 service activities incidental to water transport
    - slug: shipping_logistics
      label: Shipping and logistics
      evidence: [code, own_text, declared]
      code_prefixes: ["50", "5224"]                # 50 water transport, 5224 cargo handling
      gated_codes:
        - {prefixes: ["5229"], needs: [maritime], kinds: [own_text]}   # other transport support: only where the company's own text names a maritime word
      declared: {capabilities: [C7]}
    - slug: ports_marine_construction
      label: Ports and marine construction
      evidence: [code, own_text, notice, declared]
      code_prefixes: ["4291"]                      # construction of water projects
      words: [harbour, harbor, seaport, port of, port authority, port operat, port terminal, port infrastructure, quay, pier, breakwater, dredg, marine construction,
              satam, ruoppa, laituri, aallonmurtaj, väylä]
      declared: {categories: [port tech]}
    - slug: offshore_ocean_energy
      label: Offshore and ocean energy
      evidence: [own_text, name_corroborated, notice, declared]
      keyword_groups: [offshore_energy]
      drop_words: [floating]                       # 'floating structures' is the name of ship-building code 30110, not floating wind
      words: [wind, hydrogen, offshore wind, wind turbine, wave power, wave energy, tuulivoim, tuulipuisto, tuulienergia, aaltovoim, aaltoenergia, vety, vetyvoim, vetytalous]
      declared: {capabilities: [C8]}
    - slug: maritime_software
      label: Maritime software and tech
      evidence: [own_text, name_corroborated, declared]
      gated_codes:
        - {prefixes: ["582", "62"], needs: [maritime], kinds: [own_text, name_corroborated]}   # software only together with a maritime word
      declared: {capabilities: [C1]}
    - slug: ocean_data_monitoring
      label: Ocean data and monitoring
      evidence: [own_text, name_corroborated, notice, declared]
      impact_areas: [ocean_data, emissions]
      keyword_groups: [ocean_data]
      drop_words: [battery, hydrogen, ammonia, electrif, akku, vetyvoima, sähköist, shipping fuel, decarbon]   # the energy words of the emissions area describe decarbonisation, not monitoring; emission and päästö stay
      declared: {capabilities: [C4], categories: [ocean data, emissions]}
    - slug: aquaculture_fisheries
      label: Aquaculture and fisheries
      evidence: [code, own_text, name_corroborated, notice, declared]
      code_prefixes: ["031", "032", "102"]         # 031 fishing, 032 aquaculture (0321, 0322), 102 processing of fish
      keyword_groups: [aquaculture_bio]
      declared: {capabilities: [C5], categories: [aquatech]}
    - slug: marine_biotech
      label: Marine biotech
      evidence: [own_text, name_corroborated]
      words: [algae, seaweed, kelp, macroalgae, microalgae, marine biotech, blue biotech, blue bio, marine biolog, levä, levää, levän, leväb, leväv, merilevä, sinilevä]
      gated_codes:
        - {prefixes: ["721"], needs: [self], kinds: [own_text, name_corroborated]}   # R&D in natural sciences only with such a word
    - slug: water_pollution
      label: Water and pollution
      evidence: [code, own_text, name_corroborated, notice, declared]
      code_prefixes: ["36", "37", "39"]
      impact_areas: [water_quality]
      declared: {capabilities: [C6], categories: [water quality]}
    - slug: coastal_tourism_boating
      label: Coastal tourism and boating
      evidence: [code, own_text, declared]
      code_prefixes: ["47631", "5010"]             # 47631 retail sale of boats and boating accessories, 5010 sea and coastal passenger water transport
      gated_codes:
        - {prefixes: ["932"], needs: [boating, maritime], kinds: [own_text]}   # recreation only where the own text names boating or marine words
      declared: {capabilities: [C10]}

# Countries (jx24). `countries` drives every EU-wide adapter (TED, CORDIS, EU grants, BlueInvest) and the feed country column.
# `country_depth` is printed on /method and above the feed: it says where we hold national-register depth and where only EU sources reach.
countries: [FI, SE, EE, LV, LT, DK, "NO", DE, PL]
country_depth:
  FI: registers+contracts+grants
  EE: register+grants
  "NO": register (Brønnøysund, search by industry code and name)
  DK: register lookup by name or CVR number only (no date or code search without credentials)
  SE: connector slot, not connected (Bolagsverket has no free API)

# TED (EU contract award notices): CPV prefixes of marine, port, water and aquaculture work. A prefix matches every code that starts with it.
# A country whose depth lists "contracts" (a national procurement archive, for example Hilma) is skipped by TED so no award is counted twice.
ted_cpv:
  - {prefix: "45241", note: "Harbour construction works"}
  - {prefix: "45242", note: "Hydraulic engineering works for leisure and marine facilities"}
  - {prefix: "45243", note: "Coastal-defence works"}
  - {prefix: "45244", note: "Marine construction works"}
  - {prefix: "45248", note: "Hydro-mechanical structures"}
  - {prefix: "34510", note: "Ships"}
  - {prefix: "34520", note: "Boats"}
  - {prefix: "6372", note: "Water transport services"}
  - {prefix: "65100", note: "Water distribution and related services"}
  - {prefix: "03311", note: "Fish"}
  - {prefix: "77700", note: "Services incidental to fishing"}
  - {prefix: "98360", note: "Marine services"}
  - {prefix: "98361", note: "Aquatic-related services"}

# Same ladder and area table as config/thesis.yaml (the Baltic file is the same sector; D27). Edit both together.
# Ocean Impact Readiness read as EVIDENCE READINESS from public records (radar/ocean_impact.py; D27 in PROJECT_RULES.md). It is not a
# measure of true impact. The Ocean Impact Navigator publishes impact areas and KPIs but no levels, and no sponsor definition of the levels
# is in the repo or in data/declared, so this ladder is ours: each rung says which kind of record must be on file. The highest rung whose
# test passes wins. Rung text and the line that would raise a company one step live here, applied by code; the area table below is the only
# place an impact area is named. No rung is ever guessed: a company with no record naming an area has no level.
impact_readiness:
  title: Ocean Impact Assessment
  label: Ocean Impact Readiness
  level_max: 9
  bands: {evidenced_min: 3, low_max: 2, high_min: 8}   # level 1-2 (sector-implied only) = no band, shown as "not yet evidenced" with the record that would raise it; Medium (3-7); High (8-9, a measured outcome is on record); no level = no band (same ladder as thesis.yaml, D51)
  # Declared research (the ecosystem dataset) may set rungs 7 and 8 only, and only when its own confidence is at least min_confidence;
  # a low-confidence reading is listed as a lead and sets nothing (A24). Its score runs 0-5 on the dataset's own scale:
  # assessment_min_score = a reading with evidence is on record; measured_min_score = a quantified outcome with a stated method.
  declared_research: {min_confidence: medium, assessment_min_score: 1, measured_min_score: 4, scale_max: 5}
  official_outcome_types: []             # signal types that would count as a measured outcome from an official or register source (rung 9): none is connected
  programme_hosts: {"apelago.fi": "A'Pelago", "redstone.vc": "Redstone Blue"}   # a record on one of these hosts is a programme or portfolio declaring the company
  areas:                                 # impact area in words; words match as whole words or word starts (5+ letters); code_prefixes are industry-code families
    emissions:
      label: "Climate: lower emissions from ships, boats and ports"
      words: [emission, decarbon, shipping fuel, ammonia, hydrogen, battery, electrif, päästö, sähköist, vetyvoima, akku]
      code_prefixes: []
    aquatech:
      label: "Sustainable ocean resources: aquaculture and fisheries"
      words: [aquacultur, fish farm, aquatech, algae, seaweed, fisher, kalankasvat, kalastus, kalatalous, vesiviljely, levä]
      code_prefixes: ["03"]
    water_quality:
      label: "A clean ocean: water quality and pollution"
      words: [water quality, wastewater, ballast, water treatment, microplastic, eutroph, vedenlaatu, jätevesi, vedenpuhdist, painolastivesi, mikromuov, rehevöit]
      code_prefixes: ["36", "37"]
    ocean_data:
      label: "Ocean data and monitoring"
      words: [ocean data, oceanograph, hydrograph, remote sensing, sonar, bathymetr, marine data, merikartoit, hydrograf, kaukokartoit, luotaus, syvyysmittaus, meriympäristö, vesistömittaus]
      code_prefixes: []
    maritime:
      label: "Sustainable maritime and port technology"
      words: []
      code_prefixes: ["301", "33150", "501", "502", "52220"]
  scalability:                           # records that show a market beyond one country; otherwise "not assessed from public records"
    register_countries: {prh: FI, brreg: NO, cvr: DK, estonia_register: EE}   # source family -> the country of that register
    eu_level_types: [blueinvest, eu_project]                                   # signal types whose programme runs across EU member states
    market_words: [export, international, global, worldwide, overseas, abroad]
  levels:
    - {level: 1, rule: "Sector implied: one record points to the area: an industry code in its family, a sector word in the registered line of business, or a legal-name word backed by a second source family.", raise: "Own text that names the area: a notice title, EU project text or investor-pipeline profile holding an area word."}
    - {level: 2, rule: "Sector implied: two or more of those records point to the area; none is the source's own text.", raise: "Own text that names the area: a notice title, EU project text or investor-pipeline profile holding an area word."}
    - {level: 3, rule: "The source's own text names the area: one record (a notice title, project text or profile) holds an area word.", raise: "A second source that names the same area, or a listing on a blue programme or portfolio page."}
    - {level: 4, rule: "The source's own text names the area in two or more separate records.", raise: "A second source family that names the same area, or a listing on a blue programme or portfolio page."}
    - {level: 5, rule: "The area is corroborated: a second independent source family names it, or a blue programme or portfolio lists the company.", raise: "The other corroboration: a listing on a blue programme or portfolio page, or a second independent source family naming the area.", raise_next_rung: "Rung 6 needs a record from a source family other than the register whose own text names the area: a notice title, EU project text or investor-pipeline profile holding an area word."}
    - {level: 6, rule: "Corroborated twice: a second independent source family names the area and a blue programme or portfolio lists the company.", raise: "An impact assessment in declared research, with dataset confidence medium or high."}
    - {level: 7, rule: "An impact assessment is on record: declared research holds an Ocean Impact Readiness reading with evidence, at dataset confidence medium or high.", raise: "A quantified outcome with a stated method in the declared research reading."}
    - {level: 8, rule: "A measured outcome is on record: declared research reports a quantified outcome with a stated method.", raise: "A measured outcome from an official or register source; none is connected."}
    - {level: 9, rule: "A measured outcome from an official or register source.", raise: "None: this is the top rung."}
  no_level:
    rule: "No rung applies: no record on file names an impact area for this company."
    raise: "Any record that names an impact area: a registered line of business, a notice title, a project text or a profile."

# The fund memo (radar/memo.py). Rules only. Addressed to the fund or accelerator, never to the company.
# Levels become Low / Medium / High through the bands below; a level with no public evidence is "unknown", never Low.
memo:
  labels: {impact: Ocean impact, business: Business readiness, investment: Investment readiness, fit: Thesis fit, technology: Technology readiness}
  bands:                          # sponsor-framework level -> Low / Medium / High (Low at or under low_max, High at or over high_min)
    business: {low_max: 3, high_min: 7}       # KTH BRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    technology: {low_max: 3, high_min: 7}     # Aalto TRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    investment: {low_max: 3, high_min: 7}     # count of the 10 investment dimensions with public evidence: 1-3 Low, 4-6 Medium, 7-10 High; 0 = unknown
    impact: {category_band: Medium, dataset_low_max: 1, dataset_high_min: 4}   # the dataset's 0-5 impact reading in thirds (0-1 Low, 2-3 Medium, 4-5 High); a rule-found category alone = Medium
    fit:                          # thesis fit from the feed rule's reasons; name-only = Low, no reason = unknown
      high: [industry_code, own_text]
      medium: [line_of_business, corroborated_keyword]
      medium_codes: []                 # code families whose code match is Medium, not High (none in this thesis; see thesis.yaml, D22)
      declared_member_band: High       # a declared cohort or portfolio company has at least this fit (it was selected for the programme; D47)
      # D66, D78 (as in thesis.yaml): a High fit whose every reason is code-level (the industry code, the register's line-of-business label
      # for a code) is capped here, so the confidence rule every company page prints ("a thesis fit that rests on the industry code alone
      # is at most Medium") holds in this sector too. A declared member is excepted (the floor above applies after the cap).
      code_alone_band: Medium
      code_alone_reasons: [industry_code, line_of_business]
      code_alone_note: "the industry code alone gives at most a Medium fit"
      # D80: own text found only in these records is a buyer's words (a public contract's title says what a buyer bought): it keeps the
      # feed row strong (A5) and gives a Medium fit, like the line of business. A High fit from own text needs the company's own words.
      buyer_text_types: [public_contract]
  decisions:
    source: "The team's decision table (pass 1: exact match on all four, first match wins; pass 2: the team's condition rules; otherwise WATCHLIST). Level mapping to Low / Medium / High is the chief's configuration."
    rows:
      - {id: 1, impact: High, business: High, investment: High, fit: High, team: "Invest Candidate", decision: INVEST, action: "Start due diligence and investor introductions"}
      - {id: 2, impact: High, business: High, investment: Medium, fit: High, team: "Investment Preparation", decision: DUE DILIGENCE, action: "Help prepare fundraising and connect with investors"}
      - {id: 3, impact: High, business: Medium, investment: Medium, fit: High, team: "Accelerator Candidate", decision: ACCELERATOR, action: "Accept into accelerator and provide mentoring"}
      - {id: 4, impact: High, business: Low, investment: Low, fit: High, team: "Early-Stage Impact Startup", decision: GRANT SUPPORT, action: "Recommend grants and incubation support"}
      - {id: 5, impact: High, business: Medium, investment: Low, fit: High, team: "Growth Support", decision: PARTNER INTRODUCTION, action: "Connect with pilot customers and strategic partners"}
      - {id: 6, impact: Medium, business: High, investment: High, fit: Medium, team: "Due Diligence", decision: DUE DILIGENCE, action: "Further validate strategic fit and impact claims"}
      - {id: 7, impact: Medium, business: Medium, investment: Medium, fit: Medium, team: "Watchlist", decision: WATCHLIST, action: "Monitor progress and reassess later"}
      - {id: 8, impact: Low, business: High, investment: High, fit: Low, team: "Low Priority", decision: REJECT / LOW FIT, action: "Not aligned with A'Pelago thesis"}
      - {id: 9, impact: Low, business: Medium, investment: Medium, fit: Low, team: "Monitor Only", decision: WATCHLIST, action: "No immediate action"}
      - {id: 10, impact: Low, business: Low, investment: Low, fit: Low, team: "Reject", decision: REJECT / LOW FIT, action: "Not suitable for investment or accelerator support"}
    rules:                         # pass 2, used when no row matches; first match wins; a rule that needs an unknown level does not match
      - {id: a, when: {impact: High, business: High, investment: High}, decision: INVEST, action: "Impact, business and investment all High."}
      - {id: b, when: {impact: High, business: High, investment: Medium}, decision: DUE DILIGENCE, action: "Impact and business High, investment Medium."}
      - {id: c, when: {impact: High, business: Medium}, decision: ACCELERATOR, action: "Impact High, business Medium."}
      - {id: d, when: {impact: High, business: Low}, decision: GRANT SUPPORT, action: "Impact High, business Low."}
      - {id: e, when: {technology: High, business: [Low, Medium]}, decision: PARTNER INTRODUCTION, action: "Technology High, business Low or Medium."}
      - {id: f, when: {impact: Medium, business: Medium, investment: Medium, fit: Medium}, decision: WATCHLIST, action: "All four Medium."}
      - {id: g, when: {impact: Low, fit: Low}, decision: REJECT / LOW FIT, action: "Impact and thesis fit both Low."}
    # After the table (D76, as in thesis.yaml): the accelerator verdict is for startups.
    stage_cut:
      verdicts: [ACCELERATOR]
      decision: WATCHLIST
      text: "Startup cut (after the table): the accelerator verdict is for startups. A company founded more than {years} years ago, or one that is itself a counterpart organisation in the declared lists, stays on the watchlist instead; a declared cohort or portfolio company is a startup by declaration."

# Wide intake (jx28): startup-shaped companies are taken in wide, then thesis fit is graded by evidence. Config only: no code reads these words.
# A company enters intake on the date its `min_signals`-th startup signal (a type from `startup_signals`, not the register entry) is dated,
# provided its legal form is in `company_forms` (limited companies and cooperatives, never sole traders) and its industry code starts with
# one of `code_prefixes` or is a code listed under industry_codes.
intake:
  company_forms:
    - {code: "16", note: "Limited company (PRH company form 16)"}
    - {code: "14", note: "Cooperative (PRH company form 14)"}
  code_prefixes: ["03", "26", "27", "28", "29", "30", "582", "62", "63", "71", "72"]
  tuning_note: "The families 582 (software publishing) and 03 (fishing and aquaculture) were added after the backtest showed the net missed two cohort companies, so results for those two are measured on the companies used to tune the net."   # printed on /method and /backtest; the two families were added after the backtest, so say so
  min_signals: 1
  startup_signals: [first_sales, first_hire, eu_project, eu_grant, research_output, bf_funding, startup_notice, equity_event, public_funding]

# NACE Rev. 2 codes for the national registers of Norway and Denmark (Norwegian SN2007 uses the same four digits with a dot). A register
# adapter matches a company when its code starts with one of these; a code match alone is LOW confidence, like the Finnish codes above.
nace_codes:
  - {code: "03.11", note: "Marine fishing"}
  - {code: "03.21", note: "Marine aquaculture"}
  - {code: "30.11", note: "Building of ships and floating structures"}
  - {code: "30.12", note: "Building of pleasure and sporting boats"}
  - {code: "50.10", note: "Sea and coastal passenger water transport"}
  - {code: "50.20", note: "Sea and coastal freight water transport"}
  - {code: "52.22", note: "Service activities incidental to water transportation"}
  - {code: "71.12", note: "Engineering activities and related technical consultancy"}
  - {code: "72.19", note: "Other research and experimental development on natural sciences and engineering (NACE Rev. 2)"}
  - {code: "72.10", note: "Research and experimental development on natural sciences and engineering (NACE Rev. 2.1, which replaced 72.19; Norway codes new registrations 72.100)"}

# Ask Aava bar: intent words are inherited from config/thesis.yaml; only the examples are this thesis'.
ask:
  examples:
    - "What is new on the radar?"
    - "Show accelerator companies in Estonia"
    - "Aquaculture startups with TRL at least 4"
