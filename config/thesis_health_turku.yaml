# Second thesis, used live to prove the swap: same feed, page and radar, different sector. Health-tech, Turku region.
# Sources are the same adapters; only filters change. Declared lists for investors are reused where relevant.
id: health_tech_turku
title: Health technology, Turku region (swap demo)
sector_label: health-tech
cohort_label: Cohort radar
owner_note: Demonstration thesis for transferability. Keywords and codes below are filters, not claims about any company.
geography: {countries: [FI], feed_window_days: 90, stage_max_company_age_years: 5, city_filter: [TURKU, TURUN, LIETO, RAISIO, NAANTALI]}
themes:
  - {id: diagnostics, label: Diagnostics and medical devices}
  - {id: digital_health, label: Digital health and health data}
  - {id: biotech, label: Biotech and drug discovery}
industry_codes:
  - {code: "21200", note: "Manufacture of pharmaceutical preparations"}
  - {code: "26600", note: "Irradiation, electromedical equipment"}
  - {code: "32500", note: "Medical and dental instruments"}
  - {code: "72110", note: "R&D in biotechnology"}
# Broad consultancy and research families (code prefixes; a dot is ignored, so NACE 72.19 is 721). A code from one of these is a hint
# that the company could be in the sector, never evidence on its own: it admits a company to the main list only together with a sector
# word from the registered line of business, the source's own text, or a legal-name word corroborated by a different source family.
# Alone it leaves the row in the weak list (radar/store.py explain). 702 (management consultancy) is not on the list above today; it is
# named so that adding it later can never put a consultancy in the main list on its code alone.
code_alone_weak: ["702", "721"]
# Human health practice (TOL 86: clinics, physiotherapy, medical specialists) is care delivery, not health technology:
# companies with a code starting with these prefixes are left out of the feed and the intake tier (judge review 2, item 9).
feed_exclude_code_prefixes: ["86"]
name_keywords:
  fi: [terveys, lääke, hoiva, diagnost, bio, geeni, kuntoutus]
  sv: [hälsa, läkemedel, vård, bio]
  en: [health, medical, medtech, diagnostic, biotech, bio, pharma, clinical, care, therapy]

# Matching precision (radar/fit.py). A stop word never matches a thesis keyword, even as a word prefix.
keyword_stop_words: [have, caretaker, careers, carefree, biography, biodiversity]
# Words that make a legal name a business, never a private person (policy: personal-name holding companies are hidden).
non_person_words: [infra, design, partners, group, solutions, technologies, systems, finland, nordic, software, energy, ventures, properties, real, estate, advisory, management, services, trading, engineering, global]
# Counted types are dated public records a scout could have seen on that date (audit: EARLINESS_AUDIT.md section 2).
# Deliberately NOT counted: board_change (routine filing), capital_loss, sales_ended, employer_ended (negative),
# website_first_seen (a site existing says nothing about traction; the archive date is only an upper bound).
feed_signal_types: [register_entry, bf_funding, eu_project, patent, public_contract, job_ad, first_sales, first_hire, pilot_named, certification, programme_entry, exhibitor, award, funding_round, product_launch, public_funding, startup_notice, equity_event, research_output, website_milestone, eu_grant]
hilma_cpv_divisions: ["33", "85", "73"]
hilma_keywords: [terveys, lääke, laboratorio, diagnost, potilas, hoiva]
readiness:
  technology: {scale: "TRL 1-9", source_classes: [patent, eu_project, bf_funding]}
  business: {scale: "BRL 1-9 (KTH business readiness)", source_classes: [register_entry, public_contract, job_ad]}
  investment: {scale: "IRL 1-9", source_classes: [bf_funding, eu_project]}
  ocean_impact: null
matching:
  investors: data/declared/investors.csv
  corporates: data/declared/corporates_clients.csv
  programmes: data/declared/programmes_grants.csv

# The fund memo (radar/memo.py). Rules only. Addressed to the fund or accelerator, never to the company.
# Levels become Low / Medium / High through the bands below; a level with no public evidence is "unknown", never Low.
memo:
  labels: {impact: Clinical impact, business: Commercial readiness, investment: Investment readiness, fit: Thesis fit, technology: Technology readiness}
  bands:                          # sponsor-framework level -> Low / Medium / High (Low at or under low_max, High at or over high_min)
    business: {low_max: 3, high_min: 7}       # KTH BRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    technology: {low_max: 3, high_min: 7}     # Aalto TRL 1-9: 1-3 Low, 4-6 Medium, 7-9 High
    investment: {low_max: 3, high_min: 7}     # the Investment Readiness level the company page prints (IRL 1-9): 1-3 Low, 4-6 Medium, 7-9 High; no level = unknown
    impact: {category_band: Medium, dataset_low_max: 1, dataset_high_min: 4}   # the dataset's 0-5 impact reading in thirds (0-1 Low, 2-3 Medium, 4-5 High); a rule-found category alone = Medium
    fit:                          # thesis fit from the feed rule's reasons; name-only = Low, no reason = unknown
      high: [industry_code, own_text]
      medium: [line_of_business, corroborated_keyword]
      declared_member_band: Medium     # a declared cohort or portfolio company has at least this fit (it was selected for the programme)
  decisions:
    source: "The team's decision table (pass 1: exact match on all four, first match wins; pass 2: the team's condition rules; otherwise WATCHLIST). Level mapping to Low / Medium / High is the chief's configuration."
    rows:
      - {id: 1, impact: any, business: High, investment: High, fit: High, team: "Invest Candidate", decision: INVEST, action: "Start due diligence and investor introductions"}
      - {id: 2, impact: any, business: High, investment: Medium, fit: High, team: "Investment Preparation", decision: DUE DILIGENCE, action: "Help prepare fundraising and connect with investors"}
      - {id: 3, impact: any, business: Medium, investment: Medium, fit: High, team: "Accelerator Candidate", decision: ACCELERATOR, action: "Accept into accelerator and provide mentoring"}
      - {id: 4, impact: any, business: Low, investment: Low, fit: High, team: "Early-Stage Impact Startup", decision: GRANT SUPPORT, action: "Recommend grants and incubation support"}
      - {id: 5, impact: any, business: Medium, investment: Low, fit: High, team: "Growth Support", decision: PARTNER INTRODUCTION, action: "Connect with pilot customers and strategic partners"}
      - {id: 6, impact: any, business: High, investment: High, fit: Medium, team: "Due Diligence", decision: DUE DILIGENCE, action: "Further validate strategic fit and impact claims"}
      - {id: 7, impact: any, business: Medium, investment: Medium, fit: Medium, team: "Watchlist", decision: WATCHLIST, action: "Monitor progress and reassess later"}
      - {id: 8, impact: any, business: High, investment: High, fit: Low, team: "Low Priority", decision: REJECT / LOW FIT, action: "Not aligned with the thesis"}
      - {id: 9, impact: any, business: Medium, investment: Medium, fit: Low, team: "Monitor Only", decision: WATCHLIST, action: "No immediate action"}
      - {id: 10, impact: any, business: Low, investment: Low, fit: Low, team: "Reject", decision: REJECT / LOW FIT, action: "Not suitable for investment or programme support"}
    rules:
      - {id: e, when: {technology: High, business: [Low, Medium]}, decision: PARTNER INTRODUCTION, action: "Technology High, business Low or Medium."}
      - {id: f, when: {business: Medium, investment: Medium, fit: Medium}, decision: WATCHLIST, action: "Business, investment and fit all Medium."}

# Sources the /data page's Refresh button re-reads (names from radar/refresh.py STEPS): the fast live ones only.
refresh_adapters: [prh_notices, prh_recent]

# Wide intake (jx28): startup-shaped companies are taken in wide, then thesis fit is graded by evidence. Config only: no code reads these words.
# A company enters intake on the date its `min_signals`-th startup signal (a type from `startup_signals`, not the register entry) is dated,
# provided its legal form is in `company_forms` (limited companies and cooperatives, never sole traders) and its industry code starts with
# one of `code_prefixes` or is a code listed under industry_codes.
intake:
  company_forms:
    - {code: "16", note: "Limited company (PRH company form 16)"}
    - {code: "14", note: "Cooperative (PRH company form 14)"}
  code_prefixes: ["21", "26", "32", "62", "63", "72"]
  min_signals: 1
  startup_signals: [first_sales, first_hire, eu_project, eu_grant, research_output, bf_funding, startup_notice, equity_event, public_funding]
