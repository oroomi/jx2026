# Second thesis, used live to prove the swap: same feed, page and radar, different sector. Health-tech, Turku region.
# Sources are the same adapters; only filters change. Declared lists for investors are reused where relevant.
id: health_tech_turku
title: Health technology, Turku region (swap demo)
sector_label: health-tech
cohort_label: Cohort radar
owner_note: Demonstration thesis for transferability. Keywords and codes below are filters, not claims about any company.
geography: {countries: [FI], feed_window_days: 90, stage_max_company_age_years: 5, city_filter: [TURKU, TURUN, LIETO, RAISIO, NAANTALI]}
themes:
  - {id: diagnostics, label: Diagnostics and medical devices}
  - {id: digital_health, label: Digital health and health data}
  - {id: biotech, label: Biotech and drug discovery}
industry_codes:
  - {code: "21200", note: "Manufacture of pharmaceutical preparations"}
  - {code: "26600", note: "Irradiation, electromedical equipment"}
  - {code: "32500", note: "Medical and dental instruments"}
  - {code: "72110", note: "R&D in biotechnology"}
  - {code: "86900", note: "Other human health activities"}
name_keywords:
  fi: [terveys, lääke, hoiva, diagnost, bio, geeni, kuntoutus]
  sv: [hälsa, läkemedel, vård, bio]
  en: [health, medical, medtech, diagnostic, biotech, bio, pharma, clinical, care, therapy]

# Matching precision (radar/fit.py). A stop word never matches a thesis keyword, even as a word prefix.
keyword_stop_words: [have, caretaker, careers, carefree, biography, biodiversity]
# Words that make a legal name a business, never a private person (policy: personal-name holding companies are hidden).
non_person_words: [infra, design, partners, group, solutions, technologies, systems, finland, nordic, software, energy, ventures, properties, real, estate, advisory, management, services, trading, engineering, global]
# Counted types are dated public records a scout could have seen on that date (audit: EARLINESS_AUDIT.md section 2).
# Deliberately NOT counted: board_change (routine filing), capital_loss, sales_ended, employer_ended (negative),
# website_first_seen (a site existing says nothing about traction; the archive date is only an upper bound).
feed_signal_types: [register_entry, bf_funding, eu_project, patent, public_contract, job_ad, first_sales, first_hire, pilot_named, certification, programme_entry, exhibitor, award, funding_round, product_launch, public_funding, startup_notice, equity_event, research_output, website_milestone, eu_grant]
hilma_cpv_divisions: ["33", "85", "73"]
hilma_keywords: [terveys, lääke, laboratorio, diagnost, potilas, hoiva]
readiness:
  technology: {scale: "TRL 1-9", source_classes: [patent, eu_project, bf_funding]}
  business: {scale: "1-5 commercial readiness", source_classes: [register_entry, public_contract, job_ad]}
  investment: {scale: "IRL 1-9", source_classes: [bf_funding, eu_project]}
  ocean_impact: null
matching:
  investors: data/declared/investors.csv
  corporates: data/declared/corporates_clients.csv
  programmes: data/declared/programmes_grants.csv

# The fund memo (radar/memo.py). Rules only. Addressed to the fund or programme team, never to the company.
memo:
  labels: {impact: Clinical impact, business: Commercial readiness, investment: Investment readiness, fit: Thesis fit, technology: Technology readiness}
  bands:
    business: {low_max: 3, high_min: 7}
    investment: {low_max: 3, high_min: 7}
    technology: {low_max: 3, high_min: 7}
    impact: {category_band: Medium, dataset_low_max: 1, dataset_high_min: 4}
    fit: {high_min_reasons: 2, medium_min_reasons: 1}
  decisions:
    source: "PROVISIONAL draft by the build session for the health-technology thesis; replace with the team's table. First match wins; no match = WATCHLIST."
    rows:
      - {id: 1, impact: any, business: High, investment: High, fit: High, decision: INVEST, action: "Open an investment conversation now."}
      - {id: 2, impact: any, business: [High, Medium], investment: [High, Medium], fit: [High, Medium], decision: DUE DILIGENCE, action: "Start due diligence with the investors listed below."}
      - {id: 3, impact: any, business: High, investment: Low, fit: [High, Medium], decision: DUE DILIGENCE, action: "Commercial traction without funding history: check the traction, then introduce an investor."}
      - {id: 4, impact: any, business: Medium, investment: Low, fit: [High, Medium], decision: ACCELERATOR, action: "Offer a place in a health-technology programme with investor preparation."}
      - {id: 5, impact: any, business: Low, investment: [Low, Medium], fit: [High, Medium], decision: GRANT SUPPORT, action: "Point to the open grants and calls below before any equity."}
      - {id: 6, impact: any, business: [High, Medium], investment: any, fit: Low, decision: REJECT / LOW FIT, action: "Low fit on public evidence: no action."}
