  $('tl').innerHTML = D.signals.map(function(s){ var amt = s.amount_eur ? ' · EUR ' + Math.round(s.amount_eur).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : ''; return '<li><span class="d">'+esc(when(s))+'</span><span>'+esc(s.type_label)+amt+' <a href="'+esc(s.source_url)+'" rel="noopener">'+esc(s.source_label)+'</a></span></li>'; }).join('');
  $('facts').innerHTML = [['Website', co.website ? '<a href="'+esc(co.website)+'">'+esc(co.website.replace(/^https?:\/\//,'').replace(/\/$/,''))+'</a>' : '<span class="nodata">no data</span>'],
    ['Industry', esc(co.industry_code + ' · ' + co.industry_desc)], ['Register status', esc(co.register_status)], ['Founded', esc(day(co.founded))],
    ['Verdict basis', (rec.because_labels || []).map(function(b){ return esc(b.label) + ': ' + esc(b.band); }).join('<br>')],
    ['Investors', '<span class="nodata">no match in the declared dataset</span>'],
    ['Connectors', esc((D.connector_slots || {}).names.join(', ')) + ' <span class="muted">(not connected)</span>']]
    .map(function(f){ return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join('');
  $('theme').addEventListener('click', function(){ var r = document.documentElement, c = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), n = c === 'light' ? 'dark' : 'light'; r.dataset.theme = n; try { localStorage.setItem('radar-theme', n); } catch (e) {} });
})();
</script>
