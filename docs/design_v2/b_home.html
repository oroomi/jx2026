    .nm { font-size: var(--fs-16); }
    .ln { grid-column: 1; margin-top: 2px; }
    .cell1 { grid-column: 1; grid-row: 1; }
    .tw { grid-column: 2; grid-row: 1; }
    .sg { grid-column: 3; grid-row: 1; }
    .item .pill { grid-column: 4; }
  }
  .tw-none { color: var(--muted); opacity: .75; font-style: italic; }
  @media (max-width: 899px) { .tw-none { display: none; } }
  .listbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--s-2) var(--s-4); padding-top: var(--s-4); }
  .listbar .count { padding: 0; margin: 0; }

  .sort select { font: inherit; color: var(--text-2); background: transparent; border: 1px solid var(--hairline); border-radius: 6px; padding: 4px 8px; }
  .count { font-size: var(--fs-14); color: var(--muted); padding: var(--s-4) 0 0; }

  function when(n){ if (!n) return ''; var d = n.date; return n.prec === 'year' ? d.slice(0,4) : (n.prec === 'month' ? M[+d.slice(5,7)-1]+' '+d.slice(0,4) : (+d.slice(8,10))+' '+M[+d.slice(5,7)-1]+' '+d.slice(0,4)); }
  var VERDICT = {'PARTNER INTRODUCTION': ['Introduce', 'pill-go'], 'WATCHLIST': ['Watchlist', 'pill-none']};
  function pill(v){ var p = VERDICT[v] || [v ? v.charAt(0) + v.slice(1).toLowerCase() : 'No verdict', 'pill-info']; return '<span class="pill '+p[1]+'" title="Fund memo verdict: '+esc(v)+'">'+esc(p[0])+'</span>'; }
  function declared(r){ return r.group === 'portfolio' || r.group === 'cohort'; }
  function nd(r){ return r.newest ? r.newest.date : ''; }
  var ORDER = {
    declared: ['Portfolio and cohort first, A to Z, then new finds, newest first.', function(a, b){ if (declared(a) !== declared(b)) return declared(a) ? -1 : 1; return declared(a) ? a.name.localeCompare(b.name) : (nd(b) < nd(a) ? -1 : 1); }],
    newest: ['Newest public signal first.', function(a, b){ return nd(b) < nd(a) ? -1 : nd(b) > nd(a) ? 1 : a.name.localeCompare(b.name); }],
    name: ['Name, A to Z.', function(a, b){ return a.name.localeCompare(b.name); }]
  };
  var rows = D.rows.slice();
  var cur = D.countries[0].code;
  function render(){
    var q = ($('q').value || '').toLowerCase();
    var o = ORDER[$('sort').value] || ORDER.declared;
    var list = rows.slice().sort(o[1]).filter(function(r){ return r.country === cur && (!q || r.name.toLowerCase().indexOf(q) > -1 || (r.y || '').indexOf(q) > -1); });
    $('count').textContent = list.length + (list.length === 1 ? ' startup. ' : ' startups. ') + o[0];
    $('list').innerHTML = list.map(function(r){
      return '<li><a class="item" href="b_company.html">'
        + '<div class="cell1"><div class="nm">'+esc(r.name)+'</div>'
        + '<div class="ln">'+(r.line ? esc(r.line.text) : '<span class="nodata">no description on record</span>')+'</div></div>'
        + '<div class="tw tw-none">not stored yet</div>'
        + '<div class="sg">'+(r.newest ? '<b>'+esc(r.newest.label)+'</b> · '+esc(when(r.newest)) : '<span class="nodata">no signal yet</span>')+'</div>'
        + pill(r.verdict) + '</a></li>';
    }).join('');
  }
  $('tabs').innerHTML = D.countries.map(function(c, i){ return '<button class="tab" role="tab" data-c="'+c.code+'" aria-selected="'+(i===0)+'">'+esc(c.name)+'<span class="n">'+c.n+'</span></button>'; }).join('');
  $('tabs').addEventListener('click', function(e){ var b = e.target.closest('.tab'); if (!b) return; [].forEach.call(this.children, function(x){ x.setAttribute('aria-selected', x === b); }); cur = b.dataset.c; render(); });
  $('q').addEventListener('input', render);
  $('sort').addEventListener('change', render);
  $('fetched').textContent = 'Data as stored ' + D.fetched.slice(0,10) + '. Companies only.';
  render();
  $('theme').addEventListener('click', function(){ var r = document.documentElement, c = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), n = c === 'light' ? 'dark' : 'light'; r.dataset.theme = n; try { localStorage.setItem('radar-theme', n); } catch (e) {} });
})();
</script>
