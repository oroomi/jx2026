    if (r.level == null) return '<div class="stat-c hz"><span class="l">'+label+'</span><span class="v">no public evidence yet</span><span class="s">'+src(r.framework_url, 'framework')+'</span></div>';
    var extra = k === 'investment' && R.investment_dimensions ? ' · ' + R.investment_dimensions.filter(function(d){ return d.evidence_count > 0; }).length + ' of 10 dimensions' : '';
    return '<div class="stat-c"><span class="l">'+label+'</span><span class="v">'+r.level+' <small>/ 9</small></span><span class="s">'+(ev ? src(ev.source_url, ev.source_label) : '')+esc(extra)+'</span></div>'; }
  var last = S[0];
  $('stats').innerHTML = lvl('technology', 'Technology (TRL)') + lvl('business', 'Business (BRL)') + lvl('investment', 'Investment') + lvl('ocean_impact', 'Ocean impact')
    + '<div class="stat-c"><span class="l">Founded</span><span class="v">'+esc(co.founded ? co.founded.slice(0,4) : 'no data')+'</span><span class="s">'+src(co.source_url, 'PRH/YTJ')+'</span></div>'
    + '<div class="stat-c"><span class="l">Business ID</span><span class="v">'+esc(co.y_tunnus)+'</span><span class="s">'+src(co.source_url, 'PRH/YTJ')+'</span></div>'
    + '<div class="stat-c"><span class="l">First public record</span><span class="v">'+esc(when(first))+'</span><span class="s">'+src(first.source_url, first.source_label)+'</span></div>'
    + '<div class="stat-c"><span class="l">Last signal</span><span class="v">'+esc(when(last))+'</span><span class="s">'+src(last.source_url, last.source_label)+'</span></div>';

  // About: the six-row card with numbered sources.
  var SRC = [], idx = {};
  function cite(url, label){ if (!url) return ''; if (!(url in idx)) { SRC.push([url, label || host(url)]); idx[url] = SRC.length; } return '<sup><a href="#s'+idx[url]+'" title="'+esc(label || host(url))+'">'+idx[url]+'</a></sup>'; }
  var EMPTY = '<span class="empty6">no public evidence yet</span>';
  var wid = D.what_it_does;
  var a1 = wid ? esc(wid.text) + cite(wid.src, wid.src_label) : EMPTY;
  var fitB = (rec.because_labels || []).filter(function(b){ return /fit/i.test(b.label); })[0];
  var fitWhy = (m.why || []).filter(function(w){ return /^Thesis fit/.test(w.text); });
  var a2 = fitB && fitB.band !== 'unknown' ? esc(fitB.band) + '. ' + fitWhy.map(function(w){ var t = w.text.replace(/^Thesis fit:\s*/, '').replace(/\.$/, ''); return esc(t.charAt(0).toUpperCase() + t.slice(1)) + '.' + cite(w.url); }).join(' ') : EMPTY;
  var a3 = ['technology','business','investment','ocean_impact'].map(function(k){ var r = R[k] || {}, ev = (r.evidence || [])[0], nm = {technology:'Technology',business:'Business',investment:'Investment',ocean_impact:'Ocean impact'}[k];
    return r.level == null ? nm + ': no public evidence' : nm + ' ' + r.level + '/9' + (ev ? cite(ev.source_url, ev.source_label) : ''); }).join(' · ');
  var N = D.who_comes_next || {}, meet = (N.investors || []).concat(N.funding || []).slice(0, 3);
  var a4 = meet.length ? meet.map(function(x){ return esc(x.name) + (x.deadline ? ' (deadline ' + esc(day(x.deadline)) + ')' : '') + cite(x.source_url); }).join('; ') + '.' : EMPTY;
  var ns = D.next_step || {};
  var a5 = ns.sentence ? esc(ns.sentence) + '.' + cite(ns.source_url || co.source_url, 'decision table, rule ' + ns.rule) : EMPTY;
  var miss = (m.risks || []).filter(function(r){ return /^No public/.test(r.text); }).map(function(r){ var t = r.text.replace(/^No public (evidence for )?/, ''); return esc(t.charAt(0).toUpperCase() + t.slice(1)); });
  miss.push('Town (not stored yet)');
  var a6 = 'No public evidence yet for: ' + miss.join('; ') + '.';
  $('card').innerHTML = [['What it does', a1], ['Thesis fit', a2], ['Readiness', a3], ['Who to meet', a4], ['What the fund should do', a5], ["What's missing", a6]]
    .map(function(q){ return '<li><span class="q6">'+q[0]+'</span><div class="a6">'+q[1]+'</div></li>'; }).join('');
  $('srcs').innerHTML = SRC.map(function(x, i){ return '<li id="s'+(i+1)+'"><a href="'+esc(x[0])+'" rel="noopener">'+esc(x[1])+'</a></li>'; }).join('');

  // News: dated signals, newest first.
  $('news').innerHTML = S.map(function(s){
    var amt = s.amount_eur ? ' <span class="amt">' + eur(s.amount_eur) + (/loan/.test(s.detail) ? ' loan' : s.signal_type === 'bf_funding' ? ' grant' : '') + '</span>' : '';
    return '<li id="sig-'+s.id+'"><span class="t">'+esc(s.type_label)+amt+'</span><span class="d">'+esc(when(s))+'</span><span class="s">'+src(s.source_url, s.source_label)+'</span></li>';
  }).join('');

  // Analysts: the decision-table match.
  var BAND = {Low: 1, Medium: 2, High: 3};
  $('an').innerHTML = (rec.because_labels || []).map(function(b){
    var w = BAND[b.band];
    return '<div class="an-row"><span>'+esc(b.label)+'</span>'+(w ? '<span class="an-bar"><i style="width:'+(w/3*100).toFixed(0)+'%"></i></span>' : '<span class="an-bar hz"></span>')+'<span class="an-v">'+(w ? esc(b.band) : 'unknown')+'</span></div>';
  }).join('');
  $('an-note').textContent = 'Because: ' + (rec.because || '') + '. ' + (rec.table_source || '');

  $('theme').addEventListener('click', function(){ var r = document.documentElement, c = r.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'), n = c === 'light' ? 'dark' : 'light'; r.dataset.theme = n; try { localStorage.setItem('theme', n); } catch (e) {} });
})();
</script>
</body>
</html>
