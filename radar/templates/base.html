<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ocean Opportunity Radar{% endblock %}</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preload" href="/static/fonts/newsreader-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<script src="/static/vendor/htmx.min.js" defer></script>
<link rel="stylesheet" href="/static/chip.css?v={{ asset_v }}">
<script src="/static/theme.js?v={{ asset_v }}" defer></script>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/">Ocean Opportunity Radar</a>
    {% set cur = current_thesis(request) %}
    <nav aria-label="Main">
      <a href="/" {% if active == "feed" %}aria-current="page"{% endif %}>Feed</a>
      {% if has_route("/radar") %}<a href="/radar" {% if active == "radar" %}aria-current="page"{% endif %}>Radar</a>{% endif %}
      <a href="/method" {% if active == "method" %}aria-current="page"{% endif %}>Method</a>
    </nav>
    <form class="thesis-switch" action="{{ request.url.path }}" method="get">
      <label for="thesis-select">Thesis</label>
      <select id="thesis-select" name="thesis">
        {% for tid, title in thesis_options() %}<option value="{{ tid }}" {% if tid == cur.id %}selected{% endif %}>{{ title }}</option>{% endfor %}
      </select>
      <button type="submit">Switch</button>
    </form>
    <button id="theme-toggle" type="button" aria-label="Switch theme">Theme</button>
  </div>
</header>
<p class="wrap thesis-now">Thesis: <strong>{{ cur.title }}</strong></p>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  <span>{{ build_line }}</span>
  <span>Public records only. Companies only.</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
