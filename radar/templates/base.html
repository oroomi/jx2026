<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Ocean Opportunity Radar{% endblock %}</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;else if(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light";}catch(e){}</script>
<link rel="preload" href="/static/fonts/newsreader-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/vendor/htmx.min.js" defer></script>
<script src="/static/theme.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="/">Ocean Opportunity Radar</a>
    <nav aria-label="Main">
      <a href="/" {% if active == "feed" %}aria-current="page"{% endif %}>Feed</a>
      <a href="/radar" {% if active == "radar" %}aria-current="page"{% endif %}>Radar</a>
      <a href="/method" {% if active == "method" %}aria-current="page"{% endif %}>Method</a>
    </nav>
    <button id="theme-toggle" type="button" aria-label="Switch theme">Theme</button>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">
  <span>{{ build_line }}</span>
  <span>Public records only. Companies only.</span>
</footer>
</body>
</html>
